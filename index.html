    // --- 전역 유틸리티 및 헬퍼 함수 정의 ---
    function parseCSV(text) {
      let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
      for (l of text) {
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) l = row[++i] = '';
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = ret[++r] = [l = '']; i = 0;
        } else row[i] += l;
        p = l;
      }
      if (ret.length > 0 && ret[ret.length - 1].length === 1 && ret[ret.length - 1][0] === '') {
        ret.pop();
      }
      return ret;
    }

    function getCurrentWeekAndYear() {
      const now = new Date();
      const year = now.getFullYear();
      const jan1 = new Date(year, 0, 1);
      let day = jan1.getDay();
      let diffToMonday = day === 0 ? -6 : 1 - day; 
      const firstWeekStart = new Date(year, 0, 1 + diffToMonday);
      firstWeekStart.setHours(0, 0, 0, 0);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = today - firstWeekStart;
      const week = Math.floor(diff / (1000 * 60 * 60 * 24 * 7)) + 1;
      return { year, week };
    }

    function getWeekYearMonth(yearNum, weekNum) {
      const yr = parseInt(yearNum, 10);
      const wk = parseInt(weekNum, 10);
      if (isNaN(yr) || isNaN(wk)) return null;
      const jan1 = new Date(yr, 0, 1);
      let day = jan1.getDay();
      let diffToMonday = day === 0 ? -6 : 1 - day;
      const firstMon = new Date(yr, 0, 1 + diffToMonday);
      const targetDate = new Date(firstMon);
      targetDate.setDate(targetDate.getDate() + (wk - 1) * 7 + 3); 
      return `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}`;
    }

    function getThreeMonthsList(anchorMonth) {
      if (!anchorMonth) return [];
      const [yStr, mStr] = anchorMonth.split('-');
      const y = parseInt(yStr, 10);
      const m = parseInt(mStr, 10) - 1; 
      const list = [];
      for (let i = 2; i >= 0; i--) {
        const d = new Date(y, m - i, 1);
        list.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      }
      return list;
    }

    function formatMonthLabel(mStr) {
      if (!mStr) return '';
      const [y, m] = mStr.split('-');
      return `${parseInt(m, 10)}월`;
    }

    // 금액 및 숫자 천 단위 콤마 포맷팅 글로벌 함수
    function formatCurrency(val) {
      if (!val && val !== 0) return '0';
      const num = Number(String(val).replace(/[^0-9.-]+/g, ""));
      return isNaN(num) ? '0' : num.toLocaleString();
    }

    // 지수 백오프 방식의 Retry API 호출 전역 함수
    async function fetchWithRetry(url, options, maxRetries = 5) {
      let retries = 0;
      while (retries < maxRetries) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return await res.json();
        } catch (err) {
          retries++;
          if (retries >= maxRetries) throw err;
          await new Promise(resolve => setTimeout(resolve, Math.pow(2, retries - 1) * 1000));
        }
      }
    }

    // --- React SVG 트렌드 차트 컴포넌트 ---
    const SvgTrendChart = ({ labels, values, suffix, colorClass = "orange" }) => {
      const maxVal = Math.max(...values, 1);
      const minVal = 0; 
      const height = 150;
      const width = 450;
      const padding = { left: 50, right: 40, top: 25, bottom: 25 };
      
      const points = values.map((val, idx) => {
        const x = padding.left + (idx * (width - padding.left - padding.right) / 2);
        const y = height - padding.bottom - ((val - minVal) / (maxVal - minVal) * (height - padding.top - padding.bottom));
        return { x, y, val };
      });

      const pathD = points.reduce((acc, p, idx) => {
        return acc + (idx === 0 ? `M ${p.x} ${p.y}` : ` L ${p.x} ${p.y}`);
      }, "");

      const areaD = pathD + ` L ${points[points.length - 1].x} ${height - padding.bottom} L ${points[0].x} ${height - padding.bottom} Z`;

      const colorTheme = colorClass === "orange" 
        ? { stroke: "#f97316", fill: "url(#orangeGrad)", dot: "#ea580c" }
        : { stroke: "#3b82f6", fill: "url(#blueGrad)", dot: "#2563eb" };

      const formatVal = (v) => {
        if (suffix === "원") {
          if (v >= 100000000) return `${(v / 100000000).toFixed(1)}억`;
          if (v >= 10000) return `${Math.round(v / 10000).toLocaleString()}만`;
          return `${v.toLocaleString()}`;
        }
        return `${v.toLocaleString()}${suffix}`;
      };

      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
          <defs>
            <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#ffedd5" stopOpacity="0.85"/>
              <stop offset="100%" stopColor="#fff" stopOpacity="0.1"/>
            </linearGradient>
            <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#dbeafe" stopOpacity="0.85"/>
              <stop offset="100%" stopColor="#fff" stopOpacity="0.1"/>
            </linearGradient>
          </defs>
          
          <line x1={padding.left} y1={padding.top} x2={width - padding.right} y2={padding.top} stroke="#f1f5f9" strokeWidth="1" />
          <line x1={padding.left} y1={(padding.top + height - padding.bottom)/2} x2={width - padding.right} y2={(padding.top + height - padding.bottom)/2} stroke="#f1f5f9" strokeWidth="1" />
          <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#e2e8f0" strokeWidth="1.5" />

          <path d={areaD} fill={colorTheme.fill} />
          <path d={pathD} fill="none" stroke={colorTheme.stroke} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
          
          {points.map((p, idx) => (
            <g key={idx}>
              <circle cx={p.x} cy={p.y} r="5.5" fill={colorTheme.dot} stroke="#fff" strokeWidth="2.5" className="drop-shadow-sm" />
              <text x={p.x} y={p.y - 12} textAnchor="middle" className="text-[11px] font-bold fill-gray-800">
                {formatVal(p.val)}
              </text>
              <text x={p.x} y={height - 6} textAnchor="middle" className="text-[12px] font-bold fill-gray-500">
                {labels[idx]}
              </text>
            </g>
          ))}
        </svg>
      );
    };

    // --- 메인 App 컴포넌트 ---
    function App() {
      // ─────────────────────────────────────────────────────
      //  GAS 백엔드 URL
      //  GAS Web App 배포 후 아래 값을 실제 URL로 교체하세요.
      //  배포 설정: 다음 사용자로 실행 = 나 / 액세스 = 모든 사용자
      // ─────────────────────────────────────────────────────
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbwu-GO5I5hV8Hb7l9Jf0oXEvvZb9OdVjWAlPs--ObubqwznB7uQ3ljiuTZGyaVQ5Q8T/exec';
      const GAS_CONFIGURED = !GAS_URL.includes('YOUR_SCRIPT_ID');

      const currentTimeInfo = getCurrentWeekAndYear();
      
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [usingMockData, setUsingMockData] = useState(false);

      // 월실적_DB 데이터 상태
      const [monthlyDbData, setMonthlyDbData] = useState([]);
      const [monthlyDbLoading, setMonthlyDbLoading] = useState(false);
      const [monthlyDbError, setMonthlyDbError] = useState(null);

      // GAS 미설정 안내
      const [gasNotConfigured, setGasNotConfigured] = useState(!GAS_CONFIGURED);

      // 필터 및 화면 설정 상태
      const [selectedTab, setSelectedTab] = useState('결과'); 
      const [selectedYear, setSelectedYear] = useState(String(currentTimeInfo.year));
      const [selectedWeek, setSelectedWeek] = useState(String(currentTimeInfo.week));
      const [selectedDept, setSelectedDept] = useState('전체');
      const [sortBy, setSortBy] = useState('사번순'); 

      // 커스텀 토스트 알림 상태
      const [toast, setToast] = useState(null);

      // 진단 리포트용 기간 상태 (기본값을 '직전 4주'인 4로 변경)
      const [diagnosticPeriod, setDiagnosticPeriod] = useState(4);

      // 팝업(모달) 상태 관리
      const [modalUser, setModalUser] = useState(null);
      // [조정 사항] 개별 통계 모달 기본 기간을 '직전 4주'로 설정
      const [modalPeriod, setModalPeriod] = useState(4);

      // AI 격려 메시지 및 스마트 브리핑 생성용 상태
      const [coachingModal, setCoachingModal] = useState(null); 
      const [customContext, setCustomContext] = useState(""); 
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiBriefing, setAiBriefing] = useState("");
      const [isBriefingGenerating, setIsBriefingGenerating] = useState(false);
      const [apiError, setApiError] = useState("");
      const [copied, setCopied] = useState(false);

      // 모달 활성화 핸들러 함수
      const handleOpenModal = (sabun, name) => {
        setModalUser({ sabun, name });
      };

      const showToast = (message, type = "info") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // 오늘 날짜 및 주차별 라벨 계산
      const today = new Date();
      const formattedToday = today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

      const getWeekLabel = (weekNumStr, yearNumStr) => {
        const week = parseInt(weekNumStr, 10);
        const year = parseInt(yearNumStr, 10);

        if (year === currentTimeInfo.year) {
          if (week === currentTimeInfo.week) return `${week}주차 (이번주)`;
          if (week === currentTimeInfo.week - 1) return `${week}주차 (지난주)`;
          if (week === currentTimeInfo.week + 1) return `${week}주차 (다음주)`;
        }

        const jan1 = new Date(year, 0, 1);
        let day = jan1.getDay();
        let diffToMonday = day === 0 ? -6 : 1 - day;
        const firstWeekStart = new Date(year, 0, 1 + diffToMonday);
        firstWeekStart.setHours(0, 0, 0, 0);

        const targetDate = new Date(firstWeekStart);
        targetDate.setDate(targetDate.getDate() + (week - 1) * 7);

        const month = targetDate.getMonth() + 1;
        const date = targetDate.getDate();

        return `${week}주차 (${month}/${date})`;
      };

      // ─────────────────────────────────────────────────────
      //  GAS API 공통 호출 헬퍼
      //  GAS Web App은 302 리다이렉트를 거치므로 redirect:'follow'
      // ─────────────────────────────────────────────────────
      const fetchFromGas = async (type) => {
        const url = `${GAS_URL}?type=${type}`;
        const res = await fetch(url, { redirect: 'follow' });
        if (!res.ok) throw new Error(`GAS 응답 오류 (${res.status})`);
        const json = await res.json();
        if (json.status === 'error') throw new Error(json.message);
        return json.data; // 배열 반환
      };

      // GAS에서 받은 row 객체의 값을 문자열로 정규화
      // (숫자·날짜 등 JSON 타입 → 기존 코드와 호환되는 문자열)
      const normalizeGasRow = (row) => {
        const out = {};
        Object.keys(row).forEach(k => {
          const v = row[k];
          if (v === null || v === undefined) out[k] = '';
          else if (typeof v === 'number') out[k] = String(v);
          else out[k] = String(v);
        });
        return out;
      };

      // ─────────────────────────────────────────────────────
      //  월실적_DB 로드 (GAS ?type=monthlydb)
      // ─────────────────────────────────────────────────────
      const fetchMonthlyDb = async () => {
        if (!GAS_CONFIGURED) {
          setMonthlyDbError('GAS URL이 설정되지 않았습니다.');
          return;
        }
        setMonthlyDbLoading(true);
        setMonthlyDbError(null);
        try {
          const rawRows = await fetchFromGas('monthlydb');
          // GAS는 숫자/날짜 타입으로 반환 → 각 필드를 문자열로 정규화
          const rows = rawRows.map(normalizeGasRow);
          setMonthlyDbData(rows);
          showToast('월실적_DB 연동에 성공했습니다.', 'success');
        } catch (err) {
          console.warn('월실적_DB 연동 오류:', err.message);
          setMonthlyDbError(err.message);
          showToast('월실적_DB 연동 실패: ' + err.message, 'error');
        } finally {
          setMonthlyDbLoading(false);
        }
      };

      // ─────────────────────────────────────────────────────
      //  활동_DB 로드 (GAS ?type=activity)
      // ─────────────────────────────────────────────────────
      const fetchData = async () => {
        setLoading(true);
        setError(null);
        setUsingMockData(false);
        setAiBriefing('');

        if (!GAS_CONFIGURED) {
          setGasNotConfigured(true);
          loadMockData();
          setLoading(false);
          return;
        }

        try {
          const rawRows = await fetchFromGas('activity');
          if (!rawRows || rawRows.length === 0)
            throw new Error('데이터가 비어있습니다.');
          const rows = rawRows.map(normalizeGasRow);
          setData(rows);
          showToast('구글 시트 연동에 성공했습니다.', 'success');
        } catch (err) {
          console.warn('데이터 연동 중 오류 발생:', err.message);
          setError(err.message);
          loadMockData();
        } finally {
          setLoading(false);
        }
      };

      const loadMockData = () => {
        setUsingMockData(true);
        const mock = [
          { 소속: '1지점', 사번: '2023001', 이름: '김대표', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '예정', TA: '10', AP: '5', P: '3', C: '1', N: '1', 소개: '2', 활동계: '22', 보험료: '1,500,000', 저장일시: '', 마감일시: '' },
          { 소속: '1지점', 사번: '2023001', 이름: '김대표', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '결과', TA: '8', AP: '4', P: '2', C: '1', N: '3', 소개: '1', 활동계: '19', 보험료: '1,200,000', 저장일시: '', 마감일시: '' },
          { 소속: '1지점', 사번: '2023002', 이름: '이파트너', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '예정', TA: '15', AP: '8', P: '4', C: '2', N: '0', 소개: '1', 활동계: '30', 보험료: '2,000,000', 저장일시: '', 마감일시: '' },
          { 소속: '1지점', 사번: '2023002', 이름: '이파트너', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '결과', TA: '16', AP: '9', P: '5', C: '2', N: '1', 소개: '2', 활동계: '35', 보험료: '2,500,000', 저장일시: '', 마감일시: '' },
          { 소속: '2지점', 사번: '2023003', font: '박신입', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '결과', TA: '5', AP: '1', P: '0', C: '0', N: '0', 소개: '0', 활동계: '6', 보험료: '0', 저장일시: '', 마감일시: '' },
          { 소속: '2지점', 사번: '2023004', 이름: '최도전', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '결과', TA: '20', AP: '8', P: '4', C: '1', N: '0', 소개: '0', 활동계: '33', 보험료: '500,000', 저장일시: '', 마감일시: '' },
        ];
        setData(mock);
        showToast("예시 시뮬레이션 데이터를 불러왔습니다.", "info");
      };

      useEffect(() => {
        fetchData();
        fetchMonthlyDb();
      }, []);

      const availableYears = useMemo(() => {
        const years = [...new Set(data.map(item => item['연도']).filter(Boolean))];
        if (!years.includes(String(currentTimeInfo.year))) years.push(String(currentTimeInfo.year));
        return years.sort((a, b) => b - a);
      }, [data, currentTimeInfo.year]);

      const availableWeeks = useMemo(() => {
        const weeks = [...new Set(data.map(item => item['주차']).filter(Boolean))];
        if (!weeks.includes(String(currentTimeInfo.week))) weeks.push(String(currentTimeInfo.week));
        if (!weeks.includes(String(currentTimeInfo.week + 1))) weeks.push(String(currentTimeInfo.week + 1));
        return weeks.sort((a, b) => Number(a) - Number(b));
      }, [data, currentTimeInfo.week]);

      const availableDepts = useMemo(() => {
        const depts = [...new Set(data.map(item => item['소속']).filter(Boolean))];
        return ['전체', ...depts.sort()];
      }, [data]);

      // --- 퀵 액션 버튼 핸들러 ---
      const handleQuickAction = (tab, weekOffset) => {
        const targetYear = String(currentTimeInfo.year);
        const targetWeek = String(currentTimeInfo.week + weekOffset);
        setSelectedTab(tab);
        setSelectedYear(targetYear);
        setSelectedWeek(targetWeek);
        showToast(`${getWeekLabel(targetWeek, targetYear)} ${tab} 정보를 조회합니다.`);
      };

      // 월간 실적 계산: 월실적_DB의 '실적분석_신계약전체' 시트 기반
      const monthlyPerformanceStats = useMemo(() => {
        if (selectedTab !== '월간 실적') return null;

        const parseNum = (val) => {
          if (val === null || val === undefined || val === '') return 0;
          // 숫자 형식 정규화: 천 단위 콤마, 원화 기호 등 제거
          return Number(String(val).replace(/[^0-9.-]+/g, '')) || 0;
        };

        // 마감월 기준 앵커월 계산 (YYYY-MM 형식)
        const anchorMonth = getWeekYearMonth(selectedYear, selectedWeek);
        const monthsList = getThreeMonthsList(anchorMonth);

        // Activity 시트에서 해당 소속의 사번 목록 추출
        const memberSabunSet = new Set();
        const sabunToInfo = {}; // sabun -> { 이름, 소속 }
        data.forEach(row => {
          const sabun = String(row['사번'] || '').trim();
          if (!sabun) return;
          if (selectedDept !== '전체' && row['소속'] !== selectedDept) return;
          memberSabunSet.add(sabun);
          if (!sabunToInfo[sabun]) {
            sabunToInfo[sabun] = { 이름: row['이름'] || '', 소속: row['소속'] || '' };
          }
        });

        // 마감월 컬럼명 자동 탐지 (첫 번째 행에서 '마감월' 포함 컬럼 찾기)
        const detectColName = (rows, candidates) => {
          if (rows.length === 0) return null;
          const keys = Object.keys(rows[0]);
          for (const cand of candidates) {
            const found = keys.find(k => k.trim() === cand || k.includes(cand));
            if (found) return found;
          }
          return null;
        };

        const colMarGamwol  = detectColName(monthlyDbData, ['마감월']);
        const colMojibJabun = detectColName(monthlyDbData, ['모집자사번']);
        const colBohumryo   = detectColName(monthlyDbData, ['보험료']);
        const colGyeyakState = detectColName(monthlyDbData, ['계약상태']);

        // 컬럼이 없으면 빈 결과 반환
        if (!colMarGamwol || !colMojibJabun || !colBohumryo) {
          const emptyTotals = { premium: 0, contracts: 0, ta: 0, ap: 0, activePartners: new Set() };
          return {
            trendLabels: monthsList.map(m => formatMonthLabel(m)),
            premiumTrend: [0, 0, 0],
            contractTrend: [0, 0, 0],
            anchorMonth,
            currentMonthTotals: emptyTotals,
            currentMonthActiveCount: 0,
            anchorPartnersList: [],
            monthlyDbNotReady: true,
          };
        }

        // 마감월 값을 YYYY-MM 형식으로 정규화하는 함수
        // 시트 값이 '202506', '2025-06', '2025.06', '2025/06' 등 다양할 수 있음
        const normalizeMonth = (val) => {
          if (!val) return '';
          const s = String(val).trim().replace(/[./:]/g, '-');
          // YYYYMM -> YYYY-MM
          if (/^\d{6}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,6)}`;
          // YYYY-MM 또는 YYYY-M
          const m = s.match(/^(\d{4})-(\d{1,2})$/);
          if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}`;
          // Date 객체로 변환 시도 (엑셀 날짜 직렬 번호 등)
          const d = new Date(val);
          if (!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          return s;
        };

        // 집계 초기화
        const monthlyTotals = {};
        monthsList.forEach(m => {
          monthlyTotals[m] = { premium: 0, contracts: 0, ta: 0, ap: 0, activePartners: new Set() };
        });
        const partnerMonthlyAgg = {};
        monthsList.forEach(m => { partnerMonthlyAgg[m] = {}; });

        // 월실적_DB 필터링 및 집계
        monthlyDbData.forEach(row => {
          const rawMonth = row[colMarGamwol];
          const rowMonth = normalizeMonth(rawMonth);
          if (!monthsList.includes(rowMonth)) return;

          const sabun = String(row[colMojibJabun] || '').trim();
          if (!sabun) return;

          // 소속 필터: Activity 시트에 있는 사번만 포함
          if (selectedDept !== '전체' && !memberSabunSet.has(sabun)) return;
          if (selectedDept === '전체' && memberSabunSet.size > 0 && !memberSabunSet.has(sabun)) {
            // 전체 소속이어도 Activity 시트에 없는 사번은 제외
            // (Activity 시트에 없는 사람은 소속원이 아님)
            return;
          }

          // 계약상태 필터 - '정상'인 행만
          if (colGyeyakState) {
            const state = String(row[colGyeyakState] || '').trim();
            if (state !== '정상') return;
          }

          const premium = parseNum(row[colBohumryo]);

          monthlyTotals[rowMonth].premium += premium;
          monthlyTotals[rowMonth].contracts += 1; // 정상 계약 건수
          monthlyTotals[rowMonth].activePartners.add(sabun);

          const info = sabunToInfo[sabun] || { 이름: sabun, 소속: '' };
          if (!partnerMonthlyAgg[rowMonth][sabun]) {
            partnerMonthlyAgg[rowMonth][sabun] = {
              사번: sabun,
              이름: info.이름,
              소속: info.소속,
              건수: 0,
              보험료: 0,
            };
          }
          partnerMonthlyAgg[rowMonth][sabun].건수 += 1;
          partnerMonthlyAgg[rowMonth][sabun].보험료 += premium;
        });

        const trendLabels = monthsList.map(m => formatMonthLabel(m));
        const premiumTrend = monthsList.map(m => monthlyTotals[m].premium);
        const contractTrend = monthsList.map(m => monthlyTotals[m].contracts);

        const currentMonthTotals = monthlyTotals[anchorMonth] || { premium: 0, contracts: 0, ta: 0, ap: 0, activePartners: new Set() };
        const currentMonthActiveCount = currentMonthTotals.activePartners.size;
        const anchorPartnersList = Object.values(partnerMonthlyAgg[anchorMonth] || {}).sort((a, b) => b.보험료 - a.보험료);

        // 3개월 누적 합계
        const cumulativePremium = premiumTrend.reduce((acc, v) => acc + v, 0);
        const cumulativeContracts = contractTrend.reduce((acc, v) => acc + v, 0);

        return {
          trendLabels,
          premiumTrend,
          contractTrend,
          anchorMonth,
          currentMonthTotals,
          currentMonthActiveCount,
          anchorPartnersList,
          cumulativePremium,
          cumulativeContracts,
          monthlyDbNotReady: false,
        };
      }, [data, monthlyDbData, selectedTab, selectedYear, selectedWeek, selectedDept]);

      const filteredData = useMemo(() => {
        return data.filter(item => {
          const effectiveTab = (selectedTab === '진단 리포트') ? '결과' : selectedTab;
          const matchTab = item['예정결과'] === effectiveTab;
          const matchYear = item['연도'] === String(selectedYear);
          const matchWeek = item['주차'] === String(selectedWeek);
          const matchDept = selectedDept === '전체' || item['소속'] === selectedDept;
          return matchTab && matchYear && matchWeek && matchDept;
        });
      }, [data, selectedTab, selectedYear, selectedWeek, selectedDept]);

      // --- 성과 우수자 및 필터/사번 정렬 로직 고도화 ---
      const processedData = useMemo(() => {
        if (selectedTab === '진단 리포트' || selectedTab === '월간 실적' || filteredData.length === 0) return [];

        const parseNum = (val) => Number(String(val).replace(/[^0-9.-]+/g, "")) || 0;

        let topPremiumRow = null;
        let topNRow = null;

        // 1. 보험료 1등 계산
        filteredData.forEach(row => {
          if (!topPremiumRow) {
            topPremiumRow = row;
            return;
          }
          const curP = parseNum(row['보험료']);
          const curN = parseNum(row['N']);
          const curA = parseNum(row['활동계']);
          
          const maxP = parseNum(topPremiumRow['보험료']);
          const maxN = parseNum(topPremiumRow['N']);
          const maxA = parseNum(topPremiumRow['활동계']);

          if (curP > maxP) {
            topPremiumRow = row;
          } else if (curP === maxP) {
            if (curN > maxN) {
              topPremiumRow = row;
            } else if (curN === maxN) {
              if (curA > maxA) {
                topPremiumRow = row;
              }
            }
          }
        });

        // 2. 나머지 중 건수(N) 1등 계산
        const remainingForN = topPremiumRow 
          ? filteredData.filter(row => row !== topPremiumRow) 
          : [...filteredData];

        remainingForN.forEach(row => {
          if (!topNRow) {
            topNRow = row;
            return;
          }
          const curN = parseNum(row['N']);
          const curP = parseNum(row['보험료']);
          const curA = parseNum(row['활동계']);

          const maxN = parseNum(topNRow['N']);
          const maxP = parseNum(topNRow['보험료']);
          const maxA = parseNum(topNRow['활동계']);

          if (curN > maxN) {
            topNRow = row;
          } else if (curN === maxN) {
            if (curP > maxP) {
              topNRow = row;
            } else if (curP === maxP) {
              if (curA > maxA) {
                topNRow = row;
              }
            }
          }
        });

        if (sortBy === '실적순') {
          const rest = remainingForN.filter(row => row !== topNRow);
          rest.sort((a, b) => {
            const pA = parseNum(a['보험료']), pB = parseNum(b['보험료']);
            if (pA !== pB) return pB - pA;
            
            const nA = parseNum(a['N']), nB = parseNum(b['N']);
            if (nA !== nB) return nB - nA;
            
            const aA = parseNum(a['활동계']), aB = parseNum(b['활동계']);
            if (aA !== aB) return aB - aA;

            const sabunA = String(a['사번'] || '');
            const sabunB = String(b['사번'] || '');
            return sabunA.localeCompare(sabunB, undefined, { numeric: true });
          });

          const result = [];
          if (topPremiumRow) result.push({ ...topPremiumRow, badgePremium: true, badgeN: false });
          if (topNRow) result.push({ ...topNRow, badgePremium: false, badgeN: true });
          
          const restWithBadges = rest.map(row => ({ ...row, badgePremium: false, badgeN: false }));
          return [...result, ...restWithBadges];
        } else {
          // 사번순일 때는 모든 줄을 사번으로 정렬하며 배지와 하이라이트는 뷰에서 제거
          const allRowsWithBadges = filteredData.map(row => {
            const isPremium = topPremiumRow && row['사번'] === topPremiumRow['사번'] && row['연도'] === topPremiumRow['연도'] && row['주차'] === topPremiumRow['주차'];
            const isN = topNRow && row['사번'] === topNRow['사번'] && row['연도'] === topNRow['연도'] && row['주차'] === topNRow['주차'];
            return {
              ...row,
              badgePremium: !!isPremium,
              badgeN: !!isN
            };
          });

          allRowsWithBadges.sort((a, b) => {
            const sabunA = String(a['사번'] || '');
            const sabunB = String(b['사번'] || '');
            return sabunA.localeCompare(sabunB, undefined, { numeric: true });
          });

          return allRowsWithBadges;
        }
      }, [filteredData, selectedTab, sortBy]);

      // 팝업창 전용 동적 기간(직전 N주) 통계 계산 로직
      const modalStats = useMemo(() => {
        if (!modalUser) return null;
        
        const sabun = modalUser.sabun;
        const parseNum = (val) => Number(String(val).replace(/[^0-9.-]+/g, "")) || 0;

        const pastResultData = data.filter(d => {
          if (d['예정결과'] !== '결과') return false;
          const y = parseInt(d['연도'], 10);
          const w = parseInt(d['주차'], 10);
          return (y < currentTimeInfo.year) || (y === currentTimeInfo.year && w < currentTimeInfo.week);
        });

        const distinctWeeks = [...new Set(pastResultData.map(d => `${d['연도']}-${String(d['주차']).padStart(2, '0')}`))].sort();
        
        const currentTarget = `${selectedYear}-${String(selectedWeek).padStart(2, '0')}`;
        let targetIdx = distinctWeeks.indexOf(currentTarget);
        
        if (targetIdx === -1) {
          targetIdx = distinctWeeks.filter(w => w <= currentTarget).length - 1;
        }

        const targetWeeks = targetIdx >= 0 
          ? distinctWeeks.slice(Math.max(0, targetIdx - modalPeriod + 1), targetIdx + 1)
          : [];

        const expected = { TA: 0, AP: 0, P: 0, C: 0, N: 0, 소개: 0, 활동계: 0, 보험료: 0 };
        const actual = { TA: 0, AP: 0, P: 0, C: 0, N: 0, 소개: 0, 활동계: 0, 보험료: 0 };
        const activeWeeks = new Set();
        const weeksWithN = new Set();

        data.forEach(row => {
          if (row['사번'] !== sabun) return;
          const weekStr = `${row['연도']}-${String(row['주차']).padStart(2, '0')}`;
          
          if (!targetWeeks.includes(weekStr)) return;

          const isExpected = row['예정결과'] === '예정';
          const isActual = row['예정결과'] === '결과';

          ['TA', 'AP', 'P', 'C', 'N', '소개', '활동계', '보험료'].forEach(key => {
            const val = parseNum(row[key]);
            if (isExpected) expected[key] += val;
            if (isActual) {
              actual[key] += val;
              if (key === 'N' && val > 0) weeksWithN.add(weekStr);
            }
          });

          if (isActual) activeWeeks.add(weekStr);
        });

        return { expected, actual, activeWeeks, weeksWithN };
      }, [data, modalUser, modalPeriod, selectedYear, selectedWeek, currentTimeInfo]);

      const diagnosticData = useMemo(() => {
        if (selectedTab !== '진단 리포트') return null;

        const parseNum = (val) => Number(String(val).replace(/[^0-9.-]+/g, "")) || 0;
        
        const groups = {
          lowActivity: [],
          lowAppointment: [],
          lowClosing: [],
          lowReferral: []
        };

        const pastResultData = data.filter(d => {
          if (d['예정결과'] !== '결과') return false;
          const y = parseInt(d['연도'], 10);
          const w = parseInt(d['주차'], 10);
          return (y < currentTimeInfo.year) || (y === currentTimeInfo.year && w < currentTimeInfo.week);
        });

        const distinctWeeks = [...new Set(pastResultData.map(d => `${d['연도']}-${String(d['주차']).padStart(2, '0')}`))].sort();
        
        const currentTarget = `${selectedYear}-${String(selectedWeek).padStart(2, '0')}`;
        let targetIdx = distinctWeeks.indexOf(currentTarget);
        
        if (targetIdx === -1) {
          targetIdx = distinctWeeks.filter(w => w <= currentTarget).length - 1;
        }

        const targetWeeks = targetIdx >= 0 
          ? distinctWeeks.slice(Math.max(0, targetIdx - diagnosticPeriod + 1), targetIdx + 1)
          : [];

        const relevantData = pastResultData.filter(item => {
          if (selectedDept !== '전체' && item['소속'] !== selectedDept) return false;
          const weekStr = `${item['연도']}-${String(item['주차']).padStart(2, '0')}`;
          return targetWeeks.includes(weekStr);
        });

        const agg = {};
        relevantData.forEach(row => {
          const sabun = row['사번'];
          if (!agg[sabun]) {
            agg[sabun] = { 사번: sabun, 이름: row['이름'], 소속: row['소속'], TA: 0, AP: 0, P: 0, C: 0, N: 0, 소개: 0, 활동계: 0, weeks: new Set() };
          }
          agg[sabun].TA += parseNum(row['TA']);
          agg[sabun].AP += parseNum(row['AP']);
          agg[sabun].P += parseNum(row['P']);
          agg[sabun].C += parseNum(row['C']);
          agg[sabun].N += parseNum(row['N']);
          agg[sabun].소개 += parseNum(row['소개']);
          agg[sabun].활동계 += parseNum(row['활동계']);
          agg[sabun].weeks.add(`${row['연도']}-${row['주차']}`);
        });

        Object.values(agg).forEach(member => {
          const avgActivity = member.활동계 / member.weeks.size || 0;
          const avgReferral = member.소개 / member.weeks.size || 0;
          const taApRate = member.TA > 0 ? (member.AP / member.TA) * 100 : (member.AP > 0 ? 100 : 0);
          const apNRate = member.AP > 0 ? (member.N / member.AP) * 100 : (member.N > 0 ? 100 : 0);

          const memberData = {
            ...member,
            avgActivity: Math.round(avgActivity),
            avgReferral: Number(avgReferral.toFixed(1)),
            taApRate: Math.round(taApRate),
            apNRate: Math.round(apNRate)
          };

          if (memberData.avgActivity < 15) groups.lowActivity.push(memberData);
          if (memberData.taApRate < 50) groups.lowAppointment.push(memberData);
          if (memberData.apNRate < 30) groups.lowClosing.push(memberData);
          if (memberData.avgReferral < 2) groups.lowReferral.push(memberData);
        });

        groups.lowActivity.sort((a, b) => a.avgActivity - b.avgActivity);
        groups.lowAppointment.sort((a, b) => a.taApRate - b.taApRate);
        groups.lowClosing.sort((a, b) => a.apNRate - b.apNRate);
        groups.lowReferral.sort((a, b) => a.avgReferral - b.avgReferral);

        return groups;
      }, [data, selectedTab, selectedYear, selectedWeek, selectedDept, diagnosticPeriod]);

                      <p className="text-xs text-gray-400 mt-1">정상 계약 행 수</p>
                      <div className="absolute right-3 bottom-3 text-orange-100 opacity-50">
                        <BarChart2 size={56} />
                      </div>
                    </div>

                    {/* 3개월 누적 보험료 */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-blue-100 relative overflow-hidden">
                      <p className="text-xs font-semibold text-blue-500">3개월 누적 보험료</p>
                      <h4 className="text-xl font-extrabold text-gray-800 mt-2">
                        {formatCurrency(monthlyPerformanceStats.cumulativePremium)}원
                      </h4>
                      <p className="text-xs text-gray-400 mt-1">{monthlyPerformanceStats.trendLabels[0]} ~ {monthlyPerformanceStats.trendLabels[2]}</p>
                      <div className="absolute right-3 bottom-3 text-blue-100 opacity-50">
                        <BarChart2 size={56} />
                      </div>
                    </div>

                    {/* 3개월 누적 건수 */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-blue-100 relative overflow-hidden">
                      <p className="text-xs font-semibold text-blue-500">3개월 누적 건수</p>
                      <h4 className="text-2xl font-extrabold text-gray-800 mt-2">
                        {monthlyPerformanceStats.cumulativeContracts}건
                      </h4>
                      <p className="text-xs text-gray-400 mt-1">{monthlyPerformanceStats.trendLabels[0]} ~ {monthlyPerformanceStats.trendLabels[2]}</p>
                      <div className="absolute right-3 bottom-3 text-blue-100 opacity-50">
                        <ActivityIcon size={56} />
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className="p-5 border-b border-gray-50 flex items-center justify-between">
                      <h3 className="font-bold text-gray-800 text-base">당월 성과 랭킹 (개인별 신계약 합계)</h3>
                      <span className="text-xs text-gray-500">보험료 기준 정렬 · 계약상태 = 정상</span>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm text-center border-collapse min-w-[500px]">
                        <thead className="bg-[#f8fafc] text-gray-600 border-b border-gray-100">
                          <tr>
                            <th className="py-3 px-3 font-semibold">순위</th>
                            <th className="py-3 px-4 font-semibold">소속</th>
                            <th className="py-3 px-4 font-semibold">이름</th>
                            <th className="py-3 px-4 font-semibold">신계약 건수</th>
                            <th className="py-3 px-4 font-semibold text-right pr-8">합산 보험료</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-50">
                          {monthlyPerformanceStats.anchorPartnersList.length === 0 ? (
                            <tr>
                              <td colSpan="5" className="py-10 text-center text-gray-400">당월 실적 데이터가 존재하지 않습니다.</td>
                            </tr>
                          ) : (
                            monthlyPerformanceStats.anchorPartnersList.map((p, idx) => (
                              <tr key={idx} className={`hover:bg-gray-50/50 transition-colors ${idx === 0 ? 'bg-orange-50/40' : ''}`}>
                                <td className="py-3 px-3">
                                  {idx === 0 ? <span className="font-bold text-orange-500">🥇</span>
                                   : idx === 1 ? <span className="font-bold text-gray-500">🥈</span>
                                   : idx === 2 ? <span className="font-bold text-amber-600">🥉</span>
                                   : <span className="text-gray-400">{idx + 1}</span>}
                                </td>
                                <td className="py-3 px-4 text-gray-600">{p.소속}</td>
                                <td className="py-3 px-4 font-bold text-gray-800">
                                  <button onClick={() => handleOpenModal(p.사번, p.이름)} className="hover:text-orange-500 hover:underline">
                                    {p.이름}
                                  </button>
                                </td>
                                <td className="py-3 px-4 font-semibold text-gray-800">{p.건수}건</td>
                                <td className="py-3 px-4 font-bold text-gray-900 text-right pr-8">{formatCurrency(p.보험료)}원</td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* 2. 지능형 진단 리포트 */}
              {selectedTab === '진단 리포트' && diagnosticData && (
                <div className="animate-in fade-in duration-500 space-y-6">
                  <div className="bg-orange-50 p-5 border border-orange-100 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm">
                     <div className="flex items-center gap-3">
                       <ActivityIcon size={24} className="text-orange-500" />
                       <div>
                         <div className="flex items-center gap-3">
                           <h2 className="text-lg font-bold text-gray-800">지능형 진단 리포트</h2>
                           <select 
                             value={diagnosticPeriod}
                             onChange={(e) => setDiagnosticPeriod(Number(e.target.value))}
                             className="bg-white border border-orange-200 text-sm font-bold text-orange-700 rounded-md px-2 py-1 outline-none focus:ring-2 focus:ring-orange-300 transition-shadow"
                           >
                             <option value={50}>직전 50주</option>
                             <option value={25}>직전 25주</option>
                             <option value={12}>직전 12주</option>
                             <option value={4}>직전 4주</option>
                           </select>
                         </div>
                         <p className="text-sm text-gray-600 mt-1">선택한 기준 주차부터 {diagnosticPeriod}주간의 결과 데이터를 합산하여 조직의 취약점을 자동 진단합니다.</p>
                       </div>
                     </div>
                     <div className="text-xs bg-white border border-orange-200 px-3 py-1.5 rounded-full text-orange-700 font-semibold shadow-sm text-center">
                       복합 취약점 독립 진단 적용 (다중 해당 가능)
                     </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                    {/* 활동량 체크 */}
                    <div className="bg-white rounded-xl shadow-sm border border-red-200 p-5 flex flex-col h-full relative overflow-hidden group hover:border-red-300 transition-colors">
                      <div className="absolute top-0 left-0 w-full h-1 bg-red-400"></div>
                      <div className="border-b border-red-100 pb-3 mb-4">
                        <h3 className="text-base font-bold text-red-800 flex items-center gap-2">
                          <TrendingDown size={18} className="text-red-500" /> 활동량 체크
                        </h3>
                        <p className="text-xs text-red-600/80 mt-1.5 font-medium leading-relaxed">
                          주간 평균 활동계 15건 미만<br/>
                          <span className="text-gray-400 font-normal">(기본 볼륨 증대)</span>
                        </p>
                      </div>
                      <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                        {diagnosticData.lowActivity.length === 0 ? (
                          <p className="text-sm text-gray-400 text-center py-6">해당되는 인원이 없습니다.</p>
                        ) : (
                          diagnosticData.lowActivity.map((member, idx) => (
                            <div key={idx} className="bg-red-50/40 rounded-lg p-3 border border-red-100 hover:bg-red-50 transition-colors flex flex-col gap-2">
                              <div className="flex justify-between items-center">
                                <button onClick={() => handleOpenModal(member['사번'], member['이름'])} className="font-bold text-gray-800 hover:text-red-600 hover:underline underline-offset-4">{member['이름']}</button>
                                <button 
                                  onClick={() => openCoachingModal(member, '활동량 체크', `평균 ${member.avgActivity}건`)}
                                  className="text-xs px-2 py-1 bg-white rounded-md font-bold text-red-600 border border-red-200 shadow-sm hover:bg-red-50 transition-colors cursor-pointer"
                                >
                                  평균 {member.avgActivity}건
                                </button>
                              </div>
                              <div className="flex justify-between items-end mt-0.5 text-xs text-gray-500">
                                <span>총 활동 {member.활동계}건 / {member.weeks.size}주</span>
                                <span>{member['소속']}</span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    {/* 약속 체결 체크 */}
                    <div className="bg-white rounded-xl shadow-sm border border-amber-200 p-5 flex flex-col h-full relative overflow-hidden group hover:border-amber-300 transition-colors">
                      <div className="absolute top-0 left-0 w-full h-1 bg-amber-400"></div>
                      <div className="border-b border-amber-100 pb-3 mb-4">
                        <h3 className="text-base font-bold text-amber-800 flex items-center gap-2">
                          <Users size={18} className="text-amber-500" /> 약속 체결 체크
                        </h3>
                        <p className="text-xs text-amber-600/80 mt-1.5 font-medium leading-relaxed">
                          누적 TA 대비 AP 전환 50% 미만<br/>
                          <span className="text-gray-400 font-normal">(스크립트 점검)</span>
                        </p>
                      </div>
                      <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                        {diagnosticData.lowAppointment.length === 0 ? (
                          <p className="text-sm text-gray-400 text-center py-6">해당되는 인원이 없습니다.</p>
                        ) : (
                          diagnosticData.lowAppointment.map((member, idx) => (
                            <div key={idx} className="bg-amber-50/40 rounded-lg p-3 border border-amber-100 hover:bg-amber-50 transition-colors flex flex-col gap-2">
                              <div className="flex justify-between items-center">
                                <button onClick={() => handleOpenModal(member['사번'], member['이름'])} className="font-bold text-gray-800 hover:text-amber-600 hover:underline underline-offset-4">{member['이름']}</button>
                                <button 
                                  onClick={() => openCoachingModal(member, '약속 체결 체크', `전환율 ${member.taApRate}%`)}
                                  className="text-xs px-2 py-1 bg-white rounded-md font-bold text-amber-600 border border-amber-200 shadow-sm hover:bg-amber-50 transition-colors cursor-pointer"
                                >
                                  전환율 {member.taApRate}%
                                </button>
                              </div>
                              <div className="flex justify-between items-end mt-0.5 text-xs text-gray-500">
                                <span>누적 TA: {member.TA} ➔ AP: {member.AP}</span>
                                <span>{member['소속']}</span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    {/* 클로징 체크 */}
                    <div className="bg-white rounded-xl shadow-sm border border-blue-200 p-5 flex flex-col h-full relative overflow-hidden group hover:border-blue-300 transition-colors">
                      <div className="absolute top-0 left-0 w-full h-1 bg-blue-400"></div>
                      <div className="border-b border-blue-100 pb-3 mb-4">
                        <h3 className="text-base font-bold text-blue-800 flex items-center gap-2">
                          <Target size={18} className="text-blue-500" /> 클로징 체크
                        </h3>
                        <p className="text-xs text-blue-600/80 mt-1.5 font-medium leading-relaxed">
                          누적 AP 대비 N 전환 30% 미만<br/>
                          <span className="text-gray-400 font-normal">(동반/클로징 지원)</span>
                        </p>
                      </div>
                      <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                        {diagnosticData.lowClosing.length === 0 ? (
                          <p className="text-sm text-gray-400 text-center py-6">해당되는 인원이 없습니다.</p>
                        ) : (
                          diagnosticData.lowClosing.map((member, idx) => (
                            <div key={idx} className="bg-blue-50/40 rounded-lg p-3 border border-blue-100 hover:bg-blue-50 transition-colors flex flex-col gap-2">
                              <div className="flex justify-between items-center">
                                <button onClick={() => handleOpenModal(member['사번'], member['이름'])} className="font-bold text-gray-800 hover:text-blue-600 hover:underline underline-offset-4">{member['이름']}</button>
                                <button 
                                  onClick={() => openCoachingModal(member, '클로징 체크', `전환율 ${member.apNRate}%`)}
                                  className="text-xs px-2 py-1 bg-white rounded-md font-bold text-blue-600 border border-blue-200 shadow-sm hover:bg-blue-50 transition-colors cursor-pointer"
                                >
                                  전환율 {member.apNRate}%
                                </button>
                              </div>
                              <div className="flex justify-between items-end mt-0.5 text-xs text-gray-500">
                                <span>누적 AP: {member.AP} ➔ N: {member.N}</span>
                                <span>{member['소속']}</span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    {/* 소개 확보 체크 */}
                    <div className="bg-white rounded-xl shadow-sm border border-emerald-200 p-5 flex flex-col h-full relative overflow-hidden group hover:border-emerald-300 transition-colors">
                      <div className="absolute top-0 left-0 w-full h-1 bg-emerald-400"></div>
                      <div className="border-b border-emerald-100 pb-3 mb-4">
                        <h3 className="text-base font-bold text-emerald-800 flex items-center gap-2">
                          <UserPlus size={18} className="text-emerald-500" /> 소개 확보 체크
                        </h3>
                        <p className="text-xs text-emerald-600/80 mt-1.5 font-medium leading-relaxed">
                          주간 평균 소개 2명 미만<br/>
                          <span className="text-gray-400 font-normal">(기존 고객 터치/스크립트 점검)</span>
                        </p>
                      </div>
                      <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                        {diagnosticData.lowReferral.length === 0 ? (
                          <p className="text-sm text-gray-400 text-center py-6">해당되는 인원이 없습니다.</p>
                        ) : (
                          diagnosticData.lowReferral.map((member, idx) => (
                            <div key={idx} className="bg-emerald-50/40 rounded-lg p-3 border border-emerald-100 hover:bg-emerald-50 transition-colors flex flex-col gap-2">
                              <div className="flex justify-between items-center">
                                <button onClick={() => handleOpenModal(member['사번'], member['이름'])} className="font-bold text-gray-800 hover:text-emerald-600 hover:underline underline-offset-4">{member['이름']}</button>
                                <button 
                                  onClick={() => openCoachingModal(member, '소개 확보 체크', `평균 ${member.avgReferral}명`)}
                                  className="text-xs px-2 py-1 bg-white rounded-md font-bold text-emerald-600 border border-emerald-200 shadow-sm hover:bg-emerald-50 transition-colors cursor-pointer"
                                >
                                  평균 {member.avgReferral}명
                                </button>
                              </div>
                              <div className="flex justify-between items-end mt-0.5 text-xs text-gray-500">
                                <span>총 소개 {member.소개}명 / {member.weeks.size}주</span>
                                <span>{member['소속']}</span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* 팝업 모달 구조 렌더링 호출 */}
            {renderModal()}
            {renderCoachingModal()}

            {/* 커스텀 토스트 알림창 */}
            {toast && (
              <div className="fixed bottom-5 right-5 z-[100] flex items-center gap-2 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl animate-bounce">
                <Sparkles size={16} className="text-orange-400" />
                <span>{toast.message}</span>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
