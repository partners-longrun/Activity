                        <td className="py-3 px-2 text-gray-700 border border-gray-200 bg-white">{activityRatios.pN}</td>
                        <td className="py-3 px-2 text-gray-700 border border-gray-200 bg-white">{activityRatios.cN}</td>
                        <td className="py-3 px-2 font-bold text-orange-700 bg-orange-50/50 border border-gray-200">{activityRatios.ap소개}</td>
                        <td className="py-3 px-2 text-gray-700 border border-gray-200 bg-white">{activityRatios.주간유실적률}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderCoachingModal = () => {
        if (!coachingModal) return null;

        return (
          <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm animate-in fade-in zoom-in-95 duration-200" onClick={() => setCoachingModal(null)}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-orange-100" onClick={e => e.stopPropagation()}>
              <div className="bg-gradient-to-r from-orange-500 to-orange-400 p-5 flex justify-between items-center text-white">
                <div className="flex items-center gap-2.5">
                  <Sparkles size={22} className="text-orange-50" />
                  <h2 className="text-lg font-bold">AI 월요 코칭 어시스턴트</h2>
                </div>
                <button onClick={() => setCoachingModal(null)} className="text-orange-100 hover:text-white transition-colors">
                  <XIcon size={24} />
                </button>
              </div>

              <div className="p-6 space-y-4">
                <div className="bg-orange-50/50 p-4 rounded-xl border border-orange-100 space-y-3">
                  <div>
                    <p className="text-sm font-semibold text-gray-800 flex items-center gap-2">
                      <span className="bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-xs">타겟 진단</span>
                      {coachingModal.member.이름} 파트너 ({coachingModal.type})
                    </p>
                    <p className="text-xs text-gray-500 mt-1">지표 현황: {coachingModal.metricText}</p>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">리더의 추가 코멘트 (선택사항)</label>
                    <input 
                      type="text" 
                      placeholder="예: 내일 오전 티타임에서 이 부분 같이 이야기해보자고 전해줘" 
                      className="w-full text-sm p-2 border border-orange-200 rounded-lg outline-none focus:ring-2 focus:ring-orange-400 bg-white"
                      value={customContext}
                      onChange={(e) => setCustomContext(e.target.value)}
                      disabled={isGenerating}
                    />
                  </div>
                  <button 
                    onClick={generateWithGemini} 
                    disabled={isGenerating}
                    className="w-full flex items-center justify-center gap-2 py-2.5 bg-gradient-to-r from-orange-500 to-orange-400 text-white rounded-lg font-bold shadow-md hover:from-orange-600 hover:to-orange-500 transition-all disabled:opacity-70"
                  >
                    {isGenerating ? <Loader2 size={18} className="animate-spin" /> : <Sparkles size={18} />}
                    {isGenerating ? "AI가 맞춤형 메시지를 작성하고 있습니다..." : "✨ AI 코칭 메시지 자동 생성 ✨"}
                  </button>
                </div>

                {apiError && <p className="text-xs text-red-500 font-semibold px-1">{apiError}</p>}

                <div className="relative">
                  <textarea 
                    className="w-full h-64 p-4 text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-orange-300 resize-none leading-relaxed"
                    value={coachingModal.message}
                    onChange={(e) => setCoachingModal({...coachingModal, message: e.target.value})}
                    placeholder="AI가 파트너의 실제 데이터와 리더의 철학을 융합하여 메시지를 작성합니다."
                  />
                  <div className="absolute bottom-3 right-3">
                    <button 
                      onClick={handleCopyMessage}
                      disabled={!coachingModal.message}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-all ${
                        copied ? 'bg-emerald-500 text-white' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-50'
                      }`}
                    >
                      {copied ? <><Check size={14}/> 복사 완료</> : <><Copy size={14}/> 복사하기</>}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gray-100 p-4 md:p-6 font-sans text-gray-800">
          <div className="max-w-7xl mx-auto space-y-6">
            
            <div id="report-capture-area" className="bg-[#FFF9F5] p-2 md:p-4 rounded-xl space-y-6">
              
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-orange-100">
                <div>
                  <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <Target className="text-orange-500" size={28} />
                    활동 모니터링 대시보드
                  </h1>
                  <p className="text-sm text-gray-500 mt-1">
                    활동 및 실적을 실시간으로 확인하고 맞춤 관리를 지원합니다.
                  </p>
                </div>
                <div data-html2canvas-ignore className="flex flex-wrap items-center gap-2 md:gap-3">
                  <span className="text-sm font-semibold text-gray-600 bg-gray-50 px-3 py-2 rounded-lg border border-gray-100 shadow-sm flex items-center gap-1.5">
                    <Calendar size={14} className="text-gray-400" />
                    {formattedToday}
                  </span>
                  
                  <button 
                    onClick={() => setShowHallOfFame(true)}
                    className="flex items-center gap-2 px-3.5 py-2 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black rounded-lg shadow-md shadow-amber-500/30 hover:from-amber-400 hover:to-yellow-300 hover:shadow-amber-500/50 transition-all text-sm transform hover:-translate-y-0.5"
                    title="대형 모니터 / 키오스크 전용 10초 순환 슬라이드쇼"
                  >
                    <Crown size={16} className="text-slate-950" />
                    명예의 전당
                  </button>

                  <button 
                    onClick={generateAIBriefing}
                    disabled={isBriefingGenerating || processedData.length === 0}
                    className="flex items-center gap-2 px-3 py-2 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-lg shadow-sm hover:from-blue-600 hover:to-indigo-600 transition-all text-sm font-bold disabled:opacity-70"
                  >
                    {isBriefingGenerating ? <Loader2 size={16} className="animate-spin" /> : <Sparkles size={16} />}
                    {isBriefingGenerating ? "생성 중..." : "AI 회의 브리핑"}
                  </button>

                  <button 
                    onClick={handleDownloadReport}
                    className="flex items-center gap-2 px-3 py-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 rounded-lg transition-colors text-sm font-bold"
                  >
                    <DownloadIcon size={16} />
                    PDF 다운로드
                  </button>

                  <button 
                    onClick={fetchData}
                    className="flex items-center gap-2 px-3 py-2 bg-orange-50 text-orange-600 hover:bg-orange-100 border border-orange-200 rounded-lg transition-colors text-sm font-bold"
                  >
                    <RefreshCw size={16} className={loading ? "animate-spin" : ""} />
                    새로고침
                  </button>

                  <button 
                    onClick={() => setShowDashboardConfigModal(true)}
                    className="flex items-center gap-2 px-3.5 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 hover:text-slate-900 border border-slate-300 rounded-lg transition-colors text-sm font-bold shadow-xs"
                    title="대시보드 관리 (슬라이드 순서, 노출 여부, 지속시간 설정)"
                  >
                    <Settings size={16} className="text-slate-600" />
                    대시보드 관리
                  </button>
                </div>
              </div>

              {/* GAS URL 미설정 안내 배너 */}
              {gasNotConfigured && (
                <div data-html2canvas-ignore className="bg-blue-50 border border-blue-200 rounded-2xl p-5 flex items-start gap-4">
                  <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
                    <AlertCircle size={18} className="text-blue-600" />
                  </div>
                  <div className="text-sm text-blue-900 flex-1">
                    <p className="font-bold text-base mb-2">🔐 GAS 백엔드 URL 설정이 필요합니다</p>
                    <p className="text-blue-700 mb-3">보안을 위해 구글 시트는 비공개로 유지하고 GAS Web App을 통해 데이터를 제공합니다.</p>
                    <ol className="list-decimal list-inside space-y-1.5 text-blue-800 font-medium">
                      <li><a href="https://script.google.com" target="_blank" className="underline text-blue-600">script.google.com</a>에서 GAS 프로젝트를 열고 <code className="bg-blue-100 px-1 rounded">Code.gs</code> 내용을 업데이트하세요.</li>
                      <li><strong>[배포] → [새 배포]</strong> 클릭 → 유형: 웹 앱 선택</li>
                      <li><strong>다음 사용자로 실행: 나</strong> / <strong>액세스 권한: 모든 사용자</strong> 설정 후 배포</li>
                      <li>발급된 웹 앱 URL을 <code className="bg-blue-100 px-1 rounded">index.html</code>의 <code className="bg-blue-100 px-1 rounded">GAS_URL</code> 상수에 붙여넣으세요.</li>
                    </ol>
                  </div>
                </div>
              )}

              {/* Mock 데이터 사용 중 안내 */}
              {usingMockData && (
                <div data-html2canvas-ignore className="bg-orange-50 border-l-4 border-orange-400 p-4 rounded-r-lg flex items-start gap-3">
                  <AlertCircle className="text-orange-500 shrink-0 mt-0.5" size={20} />
                  <div className="text-sm text-orange-800">
                    <p className="font-semibold mb-1">현재 예시 데이터로 화면을 보여드리고 있습니다.</p>
                    <p className="opacity-90 font-medium">실제 데이터를 연동하려면 위 안내에 따라 GAS Web App URL을 설정해주세요.</p>
                  </div>
                </div>
              )}

              {aiBriefing && (
                <div className="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 p-5 rounded-2xl shadow-sm mb-6 animate-in fade-in slide-in-from-top-4 duration-500">
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="font-bold text-blue-900 flex items-center gap-2">
                      <Sparkles size={18} className="text-blue-600"/> 주간 스마트 브리핑 (오프라인 회의용)
                    </h3>
                    <button data-html2canvas-ignore onClick={() => setAiBriefing("")} className="text-blue-400 hover:text-blue-600">
                      <XIcon size={18} />
                    </button>
                  </div>
                  <div className="text-sm text-blue-800 whitespace-pre-wrap leading-relaxed font-medium bg-white/60 p-4 rounded-xl border border-white/50">
                    {aiBriefing}
                  </div>
                </div>
              )}

              {/* 필터 및 탭 컨트롤 영역 */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-5">
                
                {/* 좌측: 탭 메뉴 및 퀵 액션 버튼 */}
                <div className="flex flex-col space-y-2 w-full xl:w-[480px]">
                  {/* 메인 탭 */}
                  <div className="flex bg-gray-50 p-1 rounded-xl w-full">
                    {['예정', '결과', '월간 실적', '진단 리포트'].map(tab => (
                      <button
                        key={tab}
                        onClick={() => setSelectedTab(tab)}
                        className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 ${
                          selectedTab === tab 
                            ? 'bg-orange-500 text-white shadow-md' 
                            : 'text-gray-500 hover:text-orange-500 hover:bg-orange-50'
                        }`}
                      >
                        {tab}
                      </button>
                    ))}
                  </div>
                  
                  {/* 퀵 액션 버튼 그룹 */}
                  <div className="flex gap-2 w-full">
                    <button 
                      onClick={() => handleQuickAction('결과', -1)}
                      className={`flex-1 flex justify-center items-center gap-1.5 py-2 text-xs font-bold rounded-lg border shadow-sm transition-all ${
                        isLastWeekResult 
                          ? 'bg-orange-50 border-orange-400 text-orange-700 ring-1 ring-orange-400' 
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200'
                      }`}
                    >
                      <Zap size={14} className={isLastWeekResult ? "text-orange-500" : "text-orange-400"} /> 지난주 결과
                    </button>
                    <button 
                      onClick={() => handleQuickAction('예정', 0)}
                      className={`flex-1 flex justify-center items-center gap-1.5 py-2 text-xs font-bold rounded-lg border shadow-sm transition-all ${
                        isThisWeekExpected 
                          ? 'bg-orange-50 border-orange-400 text-orange-700 ring-1 ring-orange-400' 
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200'
                      }`}
                    >
                      <Zap size={14} className={isThisWeekExpected ? "text-orange-500" : "text-orange-400"} /> 이번주 예정
                    </button>
                    <button 
                      onClick={() => handleQuickAction('결과', 0)}
                      className={`flex-1 flex justify-center items-center gap-1.5 py-2 text-xs font-bold rounded-lg border shadow-sm transition-all ${
                        isThisWeekResult 
                          ? 'bg-orange-50 border-orange-400 text-orange-700 ring-1 ring-orange-400' 
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200'
                      }`}
                    >
                      <Zap size={14} className={isThisWeekResult ? "text-orange-500" : "text-orange-400"} /> 이번주 결과
                    </button>
                    <button 
                      onClick={() => handleQuickAction('예정', 1)}
                      className={`flex-1 flex justify-center items-center gap-1.5 py-2 text-xs font-bold rounded-lg border shadow-sm transition-all ${
                        isNextWeekExpected 
                          ? 'bg-orange-50 border-orange-400 text-orange-700 ring-1 ring-orange-400' 
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200'
                      }`}
                    >
                      <Zap size={14} className={isNextWeekExpected ? "text-orange-500" : "text-orange-400"} /> 다음주 예정
                    </button>
                  </div>
                </div>

                {/* 우측: 콤보박스 필터 영역 및 정렬 방식 컨트롤 */}
                <div className="flex flex-col items-end gap-3 w-full xl:w-auto">
                  <div className="flex flex-wrap items-center gap-4 w-full xl:w-auto xl:justify-end">
                    <div className="flex items-center gap-2">
                      <label className="text-xs font-semibold text-gray-500 whitespace-nowrap flex items-center gap-1">
                        <Calendar size={14} /> 연도
                      </label>
                      <select 
                        value={selectedYear} 
                        onChange={(e) => setSelectedYear(e.target.value)}
                        className="w-24 bg-gray-50 border border-gray-200 text-gray-800 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400 transition-all text-sm font-medium"
                      >
                        {availableYears.map(year => (
                          <option key={year} value={year}>{year}년</option>
                        ))}
                      </select>
                    </div>
                    
                    <div className="flex items-center gap-2">
                      <label className="text-xs font-semibold text-gray-500 whitespace-nowrap flex items-center gap-1">
                        <Calendar size={14} /> 주차
                      </label>
                      <select 
                        value={selectedWeek} 
                        onChange={(e) => setSelectedWeek(e.target.value)}
                        className="w-36 bg-gray-50 border border-gray-200 text-gray-800 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400 transition-all text-sm font-medium"
                      >
                        {availableWeeks.map(week => (
                          <option key={week} value={week}>{getWeekLabel(week, selectedYear)}</option>
                        ))}
                      </select>
                    </div>

                    <div className="flex items-center gap-2">
                      <label className="text-xs font-semibold text-gray-500 whitespace-nowrap flex items-center gap-1">
                        <Users size={14} /> 소속
                      </label>
                      <select 
                        value={selectedDept} 
                        onChange={(e) => setSelectedDept(e.target.value)}
                        className="w-28 bg-gray-50 border border-gray-200 text-gray-800 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400 transition-all text-sm font-medium"
                      >
                        {availableDepts.map(dept => (
                          <option key={dept} value={dept}>{dept}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* 정렬 버튼 영역 */}
                  {(selectedTab === '예정' || selectedTab === '결과') && (
                    <div className="flex items-center gap-1 bg-gray-100 p-1 rounded-lg">
                      <button 
                        onClick={() => setSortBy('사번순')}
                        className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${
                          sortBy === '사번순' 
                            ? 'bg-white text-orange-600 shadow-sm' 
                            : 'text-gray-500 hover:text-orange-500'
                        }`}
                      >
                        사번순
                      </button>
                      <button 
                        onClick={() => setSortBy('실적순')}
                        className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${
                          sortBy === '실적순' 
                            ? 'bg-white text-orange-600 shadow-sm' 
                            : 'text-gray-500 hover:text-orange-500'
                        }`}
                      >
                        실적순
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* 1. 예정/결과 테이블 */}
              {(selectedTab === '예정' || selectedTab === '결과') && (
                <div className="bg-white rounded-2xl shadow-sm border border-orange-100 overflow-hidden animate-in fade-in duration-500">
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm text-center border-collapse min-w-[800px]">
                      <thead className="bg-orange-100 text-orange-900 border-b border-orange-200">
                        <tr>
                          <th style={{ width: '15%' }} className="py-3.5 px-4 font-semibold">소속</th>
                          <th style={{ width: '15%' }} className="py-3.5 px-4 font-semibold">이름</th>
                          <th style={{ width: '7.5%' }} className="py-3.5 px-2 font-semibold">TA</th>
                          <th style={{ width: '7.5%' }} className="py-3.5 px-2 font-semibold">AP</th>
                          <th style={{ width: '7.5%' }} className="py-3.5 px-2 font-semibold">P</th>
                          <th style={{ width: '7.5%' }} className="py-3.5 px-2 font-semibold">C</th>
                          <th style={{ width: '7.5%' }} className="py-3.5 px-2 font-semibold">N</th>
                          <th style={{ width: '7.5%' }} className="py-3.5 px-2 font-semibold">소개</th>
                          <th style={{ width: '10%' }} className="py-3.5 px-3 font-bold bg-orange-200/50">활동계</th>
                          <th style={{ width: '15%' }} className="py-3.5 px-4 font-semibold">보험료</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {loading ? (
                          <tr>
                            <td colSpan="10" className="py-12 text-center text-gray-400">
                              <RefreshCw className="animate-spin mx-auto mb-3 text-orange-300" size={24} />
                              데이터를 불러오는 중입니다...
                            </td>
                          </tr>
                        ) : processedData.length === 0 ? (
                          <tr>
                            <td colSpan="10" className="py-12 text-center text-gray-400">
                              <AlertCircle className="mx-auto mb-3 text-gray-300" size={24} />
                              선택한 조건에 해당하는 데이터가 없습니다.
                            </td>
                          </tr>
                        ) : (
                          processedData.map((row, idx) => {
                            const showHighlighter = sortBy === '실적순' && (row.badgePremium || row.badgeN);
                            const rowBgClass = showHighlighter ? 'bg-orange-50/80 hover:bg-orange-100/80' : 'hover:bg-orange-50/50';

                            return (
                              <tr key={idx} className={`transition-colors ${rowBgClass}`}>
                                <td className="py-3 px-4 font-medium text-gray-600 text-base">{row['소속']}</td>
                                <td className="py-3 px-4 font-semibold text-gray-800 text-base">
                                  <div className="flex items-center justify-center gap-1.5">
                                    <button 
                                      onClick={() => handleOpenModal(row['사번'], row['이름'])}
                                      className="hover:text-orange-600 hover:underline underline-offset-4 cursor-pointer focus:outline-none transition-colors"
                                      title={row['마감일시'] ? `저장일시: ${formatDateTime(row['마감일시'])}` : '저장일시 없음'}
                                    >
                                      {row['이름']}
                                    </button>
                                    
                                    {sortBy === '실적순' && (
                                      <div className="flex gap-1">
                                        {row.badgePremium && (
                                          <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-yellow-100 text-yellow-800 border border-yellow-200" title="보험료 1등">
                                            👑 보험료
                                          </span>
                                        )}
                                        {row.badgeN && (
                                          <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-orange-100 text-orange-800 border border-orange-200" title="건수 1등">
                                            🔥 건수
                                          </span>
                                        )}
                                      </div>
                                    )}
                                  </div>
                                </td>
                                <td className="py-3 px-2 text-gray-600 text-base">{row['TA']}</td>
                                <td className="py-3 px-2 text-gray-600 text-base">{row['AP']}</td>

              orgInfoData={orgInfoData}
              dashboardConfigs={dashboardConfigs}
              selectedYear={selectedYear}
              selectedWeek={selectedWeek}
              onRefreshData={() => {
                fetchData();
                fetchMonthlyDb();
                fetchOrgInfo();
                fetchDashboardConfig();
              }}
            />

            {/* [신규] 대시보드 관리 (슬라이드 순서/노출/시간 설정) 모달 */}
            <DashboardConfigModal 
              isOpen={showDashboardConfigModal}
              onClose={() => setShowDashboardConfigModal(false)}
              configs={dashboardConfigs}
              onSave={saveDashboardConfigToGas}
              isSaving={isSavingConfig}
            />

            {/* 커스텀 토스트 알림창 */}
            {toast && (
              <div className="fixed bottom-5 right-5 z-[100] flex items-center gap-2 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl animate-bounce">
                <Sparkles size={16} className="text-orange-400" />
                <span>{toast.message}</span>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
