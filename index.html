    // --- 전역 유틸리티 및 헬퍼 함수 정의 ---
    // 구글 드라이브 및 일반 이미지 URL을 고화질 웹 이미지 직링크로 변환
    function toDirectImageUrl(url) {
      if (!url) return '';
      const s = String(url).trim();
      if (!s) return '';
      if (s.startsWith('data:image') || s.startsWith('blob:')) return s;

      let fileId = null;
      const match1 = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match1 && match1[1]) {
        fileId = match1[1];
      } else {
        const match2 = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match2 && match2[1]) {
          fileId = match2[1];
        }
      }

      if (fileId) {
        return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return s;
    }
    function parseCSV(text) {
      let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
      for (l of text) {
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) l = row[++i] = '';
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = ret[++r] = [l = '']; i = 0;
        } else row[i] += l;
        p = l;
      }
      if (ret.length > 0 && ret[ret.length - 1].length === 1 && ret[ret.length - 1][0] === '') {
        ret.pop();
      }
      return ret;
    }

    function getCurrentWeekAndYear() {
      const now = new Date();
      const year = now.getFullYear();
      const jan1 = new Date(year, 0, 1);
      let day = jan1.getDay();
      let diffToMonday = day === 0 ? -6 : 1 - day; 
      const firstWeekStart = new Date(year, 0, 1 + diffToMonday);
      firstWeekStart.setHours(0, 0, 0, 0);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = today - firstWeekStart;
      const week = Math.floor(diff / (1000 * 60 * 60 * 24 * 7)) + 1;
      return { year, week };
    }

    function getWeekYearMonth(yearNum, weekNum) {
      const yr = parseInt(yearNum, 10);
      const wk = parseInt(weekNum, 10);
      if (isNaN(yr) || isNaN(wk)) return null;
      const jan1 = new Date(yr, 0, 1);
      let day = jan1.getDay();
      let diffToMonday = day === 0 ? -6 : 1 - day;
      const firstMon = new Date(yr, 0, 1 + diffToMonday);
      const targetDate = new Date(firstMon);
      targetDate.setDate(targetDate.getDate() + (wk - 1) * 7 + 3); 
      return `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}`;
    }

    function getThreeMonthsList(anchorMonth) {
      if (!anchorMonth) return [];
      const [yStr, mStr] = anchorMonth.split('-');
      const y = parseInt(yStr, 10);
      const m = parseInt(mStr, 10) - 1; 
      const list = [];
      for (let i = 2; i >= 0; i--) {
        const d = new Date(y, m - i, 1);
        list.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      }
      return list;
    }

    function formatMonthLabel(mStr) {
      if (!mStr) return '';
      const [y, m] = mStr.split('-');
      return `${parseInt(m, 10)}월`;
    }

    // 마감월 및 퇴사연월 값을 YYYY-MM 형식으로 정규화 (예: 202608 -> 2026-08, 2026.08 -> 2026-08)
    function normalizeMonth(val) {
      if (!val) return '';
      const s = String(val).trim().replace(/[./:]/g, '-');
      if (/^\d{6}$/.test(s)) return `${s.slice(0, 4)}-${s.slice(4, 6)}`;
      const m = s.match(/^(\d{4})-(\d{1,2})$/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}`;
      const d = new Date(val);
      if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      return s;
    }

    // 특정 대상월(YYYY-MM) 기준 재직 여부 판별 (퇴사연월이 없거나 대상월 <= 퇴사연월이면 재직)
    function isUserActiveInMonth(user, targetMonth) {
      if (!user) return false;
      const retireVal = user['퇴사여부'];
      if (!retireVal) return true;
      const retireMonth = normalizeMonth(retireVal);
      if (!retireMonth) return true;
      return targetMonth <= retireMonth;
    }

    // 금액 및 숫자 천 단위 콤마 포맷팅 글로벌 함수
    function formatCurrency(val) {
      if (!val && val !== 0) return '0';
      const num = Number(String(val).replace(/[^0-9.-]+/g, ""));
      return isNaN(num) ? '0' : num.toLocaleString();
    }

    // 날짜 및 시간 포맷을 보기 좋게 변경 (예: 2026-08-09T09:30:00 -> 2026년 8월 9일 오전 9시 30분)
    function formatDateTime(val) {
      if (!val) return '';
      const normalized = String(val).trim().replace(' ', 'T');
      const date = new Date(normalized);
      if (isNaN(date.getTime())) {
        return String(val);
      }
      const y = date.getFullYear();
      const m = date.getMonth() + 1;
      const d = date.getDate();
      let h = date.getHours();
      const min = date.getMinutes();
      const ampm = h >= 12 ? '오후' : '오전';
      h = h % 12;
      h = h ? h : 12; // 0시는 12시로 표기
      return `${y}년 ${m}월 ${d}일 ${ampm} ${h}시 ${min}분`;
    }

    // 지수 백오프 방식의 Retry API 호출 전역 함수
    async function fetchWithRetry(url, options, maxRetries = 5) {
      let retries = 0;
      while (retries < maxRetries) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return await res.json();
        } catch (err) {
          retries++;
          if (retries >= maxRetries) throw err;
          await new Promise(resolve => setTimeout(resolve, Math.pow(2, retries - 1) * 1000));
        }
      }
    }

    // --- React SVG 트렌드 차트 컴포넌트 ---
    const SvgTrendChart = ({ labels, values, suffix, colorClass = "orange" }) => {
      const maxVal = Math.max(...values, 1);
      const minVal = 0; 
      const height = 150;
      const width = 450;
      const padding = { left: 50, right: 40, top: 25, bottom: 25 };
      
      const points = values.map((val, idx) => {
        const x = padding.left + (idx * (width - padding.left - padding.right) / 2);
        const y = height - padding.bottom - ((val - minVal) / (maxVal - minVal) * (height - padding.top - padding.bottom));
        return { x, y, val };
      });

      const pathD = points.reduce((acc, p, idx) => {
        return acc + (idx === 0 ? `M ${p.x} ${p.y}` : ` L ${p.x} ${p.y}`);
      }, "");

      const areaD = pathD + ` L ${points[points.length - 1].x} ${height - padding.bottom} L ${points[0].x} ${height - padding.bottom} Z`;

      const colorTheme = colorClass === "orange" 
        ? { stroke: "#f97316", fill: "url(#orangeGrad)", dot: "#ea580c" }
        : { stroke: "#3b82f6", fill: "url(#blueGrad)", dot: "#2563eb" };

      const formatVal = (v) => {
        if (suffix === "원") {
          if (v >= 100000000) return `${(v / 100000000).toFixed(1)}억`;
          if (v >= 10000) return `${Math.round(v / 10000).toLocaleString()}만`;
          return `${v.toLocaleString()}`;
        }
        return `${v.toLocaleString()}${suffix}`;
      };

      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
          <defs>
            <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#ffedd5" stopOpacity="0.85"/>
              <stop offset="100%" stopColor="#fff" stopOpacity="0.1"/>
            </linearGradient>
            <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#dbeafe" stopOpacity="0.85"/>
              <stop offset="100%" stopColor="#fff" stopOpacity="0.1"/>
            </linearGradient>
          </defs>
          
          <line x1={padding.left} y1={padding.top} x2={width - padding.right} y2={padding.top} stroke="#f1f5f9" strokeWidth="1" />
          <line x1={padding.left} y1={(padding.top + height - padding.bottom)/2} x2={width - padding.right} y2={(padding.top + height - padding.bottom)/2} stroke="#f1f5f9" strokeWidth="1" />
          <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#e2e8f0" strokeWidth="1.5" />

          <path d={areaD} fill={colorTheme.fill} />
          <path d={pathD} fill="none" stroke={colorTheme.stroke} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
          
          {points.map((p, idx) => (
            <g key={idx}>
              <circle cx={p.x} cy={p.y} r="5.5" fill={colorTheme.dot} stroke="#fff" strokeWidth="2.5" className="drop-shadow-sm" />
              <text x={p.x} y={p.y - 12} textAnchor="middle" className="text-[11px] font-bold fill-gray-800">
                {formatVal(p.val)}
              </text>
              <text x={p.x} y={height - 6} textAnchor="middle" className="text-[12px] font-bold fill-gray-500">
                {labels[idx]}
              </text>
            </g>
          ))}
        </svg>
      );
    };

    // ─────────────────────────────────────────────────────────────
    //  대시보드 관리 기본 슬라이드 설정 템플릿 (기본 6개)
    // ─────────────────────────────────────────────────────────────
    const DEFAULT_SLIDE_CONFIGS = [
      { id: 'last_month_champion', '슬라이드순서': 1, '슬라이드명': '지난달 실적 챔피언', '활성화여부': 'Y', '지속시간': 10, '슬라이드설명': '지난달 월 보험료 1등 및 월 체결건수 1등 영광의 챔피언 시상', iconType: 'Crown' },
      { id: 'monthly_premium_top3', '슬라이드순서': 2, '슬라이드명': '이번달 실적 현황 1 (보험료 TOP 3)', '활성화여부': 'Y', '지속시간': 10, '슬라이드설명': '당월 누적 체결 보험료 기준 TOP 3 챔피언 포디움', iconType: 'Trophy' },
      { id: 'monthly_contracts_top3', '슬라이드순서': 3, '슬라이드명': '이번달 실적 현황 2 (다건 체결왕 TOP 3)', '활성화여부': 'Y', '지속시간': 10, '슬라이드설명': '당월 누적 체결 건수 기준 TOP 3 다건왕 포디움', iconType: 'Sparkles' },
      { id: 'weekly_premium_top10', '슬라이드순서': 4, '슬라이드명': '주간 실적 현황 1 (보험료 1~10위)', '활성화여부': 'Y', '지속시간': 10, '슬라이드설명': '이번 주 실시간 체결 보험료 자석 그래프 현황판', iconType: 'BarChart2' },
      { id: 'weekly_contracts_top10', '슬라이드순서': 5, '슬라이드명': '주간 실적 현황 2 (건수 1~10위)', '활성화여부': 'Y', '지속시간': 10, '슬라이드설명': '이번 주 실시간 체결 건수 자석 그래프 현황판', iconType: 'Award' },
      { id: 'hq_monthly_goal', '슬라이드순서': 6, '슬라이드명': '사업단 목표달성 현황', '활성화여부': 'Y', '지속시간': 10, '슬라이드설명': '투게더사업단 월간 목표 대비 달성률 및 실판매 참여 인원 현황', iconType: 'Target' }
    ];

    // 슬라이드 설정 항목 정규화 헬퍼 함수
    function normalizeSlideConfigs(rawList) {
      const baseMap = {};
      DEFAULT_SLIDE_CONFIGS.forEach(d => { baseMap[d.id] = d; });

      let list = Array.isArray(rawList) && rawList.length > 0 ? [...rawList] : [];

      if (list.length === 0) {
        return DEFAULT_SLIDE_CONFIGS.map(d => ({ ...d }));
      }

      return list.map((item, idx) => {
        const order = Number(item['슬라이드순서']) || (idx + 1);
        const name = String(item['슬라이드명'] || '').trim() || DEFAULT_SLIDE_CONFIGS[idx % DEFAULT_SLIDE_CONFIGS.length]['슬라이드명'];
        const active = String(item['활성화여부'] || 'Y').trim().toUpperCase() === 'N' ? 'N' : 'Y';
        const duration = Math.max(3, Math.min(300, Number(item['지속시간']) || 10)); // 3초 ~ 300초 보장
        const desc = String(item['슬라이드설명'] || '').trim();

        // 고유 슬라이드 ID 식별
        let id = item.id;
        if (!id) {
          if (name.includes('지난달') || name.includes('전월')) id = 'last_month_champion';
          else if ((name.includes('이번달') || name.includes('당월')) && name.includes('보험료')) id = 'monthly_premium_top3';
          else if ((name.includes('이번달') || name.includes('당월') || name.includes('체결왕')) && (name.includes('건수') || name.includes('다건'))) id = 'monthly_contracts_top3';
          else if (name.includes('주간') && name.includes('보험료')) id = 'weekly_premium_top10';
          else if (name.includes('주간') && (name.includes('건수') || name.includes('체결'))) id = 'weekly_contracts_top10';
          else if (name.includes('목표') || name.includes('사업단')) id = 'hq_monthly_goal';
          else id = DEFAULT_SLIDE_CONFIGS[idx % DEFAULT_SLIDE_CONFIGS.length].id;
        }

        const iconType = baseMap[id]?.iconType || 'Sparkles';

        return {
          id,
          '슬라이드순서': order,
          '슬라이드명': name,
          '활성화여부': active,
          '지속시간': duration,
          '슬라이드설명': desc || baseMap[id]?.['슬라이드설명'] || '',
          iconType
        };
      }).sort((a, b) => Number(a['슬라이드순서']) - Number(b['슬라이드순서']));
    }

    // ─────────────────────────────────────────────────────────────
    //  [신규] 대시보드 관리 (슬라이드 순서, 활성화, 지속시간 설정) 모달
    // ─────────────────────────────────────────────────────────────
    const DashboardConfigModal = ({ isOpen, onClose, configs = [], onSave, isSaving = false }) => {
      if (!isOpen) return null;

      const [localList, setLocalList] = useState(() => normalizeSlideConfigs(configs));

      useEffect(() => {
        setLocalList(normalizeSlideConfigs(configs));
      }, [configs, isOpen]);

      // 순서 위로 이동
      const handleMoveUp = (index) => {
        if (index === 0) return;
        setLocalList(prev => {
          const next = [...prev];
          const temp = next[index - 1];
          next[index - 1] = next[index];
          next[index] = temp;
          return next.map((item, idx) => ({ ...item, '슬라이드순서': idx + 1 }));
        });
      };

      // 순서 아래로 이동
      const handleMoveDown = (index) => {
        if (index === localList.length - 1) return;
        setLocalList(prev => {
          const next = [...prev];
          const temp = next[index + 1];
          next[index + 1] = next[index];
          next[index] = temp;
          return next.map((item, idx) => ({ ...item, '슬라이드순서': idx + 1 }));
        });
      };

      // 활성화 여부 토글 (Y <-> N)
      const handleToggleActive = (id) => {
        setLocalList(prev => prev.map(item => {
          if (item.id === id) {
            const nextVal = item['활성화여부'] === 'Y' ? 'N' : 'Y';
            return { ...item, '활성화여부': nextVal };
          }
          return item;
        }));
      };

      // 지속시간 변경 (+ / -)
      const handleChangeDuration = (id, delta) => {
        setLocalList(prev => prev.map(item => {
          if (item.id === id) {
            const current = Number(item['지속시간']) || 10;
            const updated = Math.max(3, Math.min(300, current + delta));
            return { ...item, '지속시간': updated };
          }
          return item;
        }));
      };

      // 지속시간 직접 입력
      const handleDurationInput = (id, val) => {
        const num = parseInt(val, 10);
        setLocalList(prev => prev.map(item => {
          if (item.id === id) {
            return { ...item, '지속시간': isNaN(num) ? 10 : Math.max(1, Math.min(300, num)) };
          }
          return item;
        }));
      };

      // 기본값으로 복원
      const handleResetDefault = () => {
        if (window.confirm('슬라이드 설정을 초기 기본값(모두 활성화, 10초, 순서 1~6)으로 복원하시겠습니까?')) {
          setLocalList(DEFAULT_SLIDE_CONFIGS.map(d => ({ ...d })));
        }
      };

      // 저장 및 적용
      const handleSaveSubmit = () => {
        if (onSave) {
          onSave(localList);
        }
      };

      const getSlideIcon = (type) => {
        switch (type) {
          case 'Crown': return <Crown size={20} className="text-amber-500" />;
          case 'Trophy': return <Trophy size={20} className="text-amber-500" />;
          case 'Sparkles': return <Sparkles size={20} className="text-blue-500" />;
          case 'BarChart2': return <BarChart2 size={20} className="text-emerald-500" />;
          case 'Award': return <Award size={20} className="text-teal-500" />;
          case 'Target': return <Target size={20} className="text-indigo-500" />;
          default: return <Sparkles size={20} className="text-amber-500" />;
        }
      };

      const activeCount = localList.filter(item => item['활성화여부'] === 'Y').length;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/60 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border border-gray-100" onClick={e => e.stopPropagation()}>
            
            {/* 상단 모달 헤더 */}
            <div className="p-6 md:px-8 border-b border-gray-100 flex justify-between items-center bg-gradient-to-r from-slate-900 via-slate-850 to-slate-900 text-white">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-yellow-500 flex items-center justify-center text-slate-950 shadow-md">
                  <Settings size={22} />
                </div>
                <div>
                  <h2 className="text-xl md:text-2xl font-black tracking-tight flex items-center gap-2">
                    대시보드 관리
                    <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/30">
                      명예의 전당 슬라이드 설정
                    </span>
                  </h2>
                  <p className="text-xs md:text-sm text-slate-300 mt-0.5 font-medium">
                    '대시보드관리' 시트와 연동되어 슬라이드 순서, 노출 여부, 재생 시간을 제어합니다.
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors">
                <XIcon size={22} />
              </button>
            </div>

            {/* 안내 배너 */}
            <div className="bg-amber-50/70 border-b border-amber-100/80 px-6 md:px-8 py-3 flex flex-wrap items-center justify-between text-xs md:text-sm text-amber-900 gap-2">
              <div className="flex items-center gap-2 font-medium">
                <span className="w-2 h-2 rounded-full bg-amber-500 inline-block animate-pulse"></span>
                <span>총 <strong>{localList.length}개</strong> 슬라이드 중 <strong className="text-blue-700">{activeCount}개</strong> 활성화됨</span>
              </div>
              <div className="text-xs text-amber-700 font-semibold">
                ※ 활성화(Y)된 슬라이드만 설정된 순서와 시간대로 슬라이드쇼에 노출됩니다.
              </div>
            </div>

            {/* 슬라이드 목록 스크롤 영역 */}
            <div className="p-6 md:p-8 overflow-y-auto flex-1 space-y-4 bg-slate-50/50">
              {localList.map((slide, idx) => {
                const isActive = slide['활성화여부'] === 'Y';
                return (
                  <div 
                    key={slide.id || idx}
                    className={`rounded-2xl border transition-all p-4 md:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 ${
                      isActive 
                        ? "bg-white border-slate-200/90 shadow-sm hover:shadow-md hover:border-amber-400/60" 
                        : "bg-slate-100/70 border-slate-200 opacity-60 grayscale-[40%]"
                    }`}
                  >
                    {/* 좌측: 순서 조절 & 슬라이드 정보 */}
                    <div className="flex items-center gap-3.5 flex-1 min-w-0">
                      {/* 순서 변경 버튼들 */}
                      <div className="flex flex-col gap-1 shrink-0">
                        <button
                          type="button"
                          onClick={() => handleMoveUp(idx)}
                          disabled={idx === 0}
                          className="p-1 rounded-lg bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-800 disabled:opacity-30 disabled:hover:bg-slate-100 transition-colors"
                          title="위로 이동"
                        >
                          <ArrowUp size={14} />
                        </button>
                        <button
                          type="button"
                          onClick={() => handleMoveDown(idx)}
                          disabled={idx === localList.length - 1}
                          className="p-1 rounded-lg bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-800 disabled:opacity-30 disabled:hover:bg-slate-100 transition-colors"
                          title="아래로 이동"
                        >
                          <ArrowDown size={14} />
                        </button>
                      </div>

                      {/* 순서 뱃지 */}
                      <div className="w-8 h-8 rounded-xl bg-slate-900 text-amber-300 font-black text-sm flex items-center justify-center shrink-0 shadow-sm">
                        {idx + 1}
                      </div>

                      {/* 아이콘 */}
                      <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center shrink-0 border border-slate-200">
                        {getSlideIcon(slide.iconType)}
                      </div>

                      {/* 슬라이드명 및 설명 */}
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-2">
                          <h4 className="text-base font-extrabold text-slate-900 truncate">
                            {slide['슬라이드명']}
                          </h4>
                          {isActive ? (
                            <span className="text-[11px] font-black px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 shrink-0">
                              노출 중
                            </span>
                          ) : (
                            <span className="text-[11px] font-black px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 shrink-0">
                              숨김
                            </span>
                          )}
                        </div>
                        <p className="text-xs text-slate-500 truncate mt-0.5 font-medium">
                          {slide['슬라이드설명']}
                        </p>
                      </div>
                    </div>

                    {/* 우측: 활성화 토글 & 지속시간 설정 */}
                    <div className="flex items-center justify-between md:justify-end gap-5 shrink-0 pt-3 md:pt-0 border-t md:border-t-0 border-slate-100">
                      
                      {/* 지속시간 (초) 조절기 */}
                      <div className="flex items-center gap-1.5 bg-slate-100/90 p-1.5 rounded-xl border border-slate-200">
                        <Clock size={15} className="text-slate-500 ml-1" />
                        <span className="text-xs font-bold text-slate-600 mr-1">재생시간:</span>
                        <button
                          type="button"
                          onClick={() => handleChangeDuration(slide.id, -1)}
                          className="w-7 h-7 rounded-lg bg-white hover:bg-slate-200 text-slate-800 font-black flex items-center justify-center shadow-xs text-sm"
                          title="1초 감소"
                        >
                          -
                        </button>
                        <input
                          type="number"
                          min="3"
                          max="300"
                          value={slide['지속시간']}
                          onChange={(e) => handleDurationInput(slide.id, e.target.value)}
                          className="w-12 text-center text-sm font-black bg-transparent border-none text-slate-900 focus:outline-none"
                        />
                        <span className="text-xs font-black text-slate-600 mr-1">초</span>
                        <button
                          type="button"
                          onClick={() => handleChangeDuration(slide.id, 1)}
                          className="w-7 h-7 rounded-lg bg-white hover:bg-slate-200 text-slate-800 font-black flex items-center justify-center shadow-xs text-sm"
                          title="1초 증가"
                        >
                          +
                        </button>
                      </div>

                      {/* 노출 활성화 여부 토글 버튼 */}
                      <button
                        type="button"
                        onClick={() => handleToggleActive(slide.id)}
                        className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs md:text-sm font-black transition-all shadow-xs ${
                          isActive 
                            ? "bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/20" 
                            : "bg-slate-200 hover:bg-slate-300 text-slate-700"
                        }`}
                        title={isActive ? "클릭 시 슬라이드 숨김" : "클릭 시 슬라이드 노출"}
                      >
                        {isActive ? <Eye size={16} /> : <EyeOff size={16} />}
                        <span>{isActive ? "활성화 (Y)" : "비활성화 (N)"}</span>
                      </button>

                    </div>
                  </div>
                );
              })}
            </div>

            {/* 하단 모달 액션 푸터 */}
            <div className="p-5 md:px-8 bg-white border-t border-gray-100 flex flex-wrap items-center justify-between gap-3">
              <button
                type="button"
                onClick={handleResetDefault}
                className="px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs md:text-sm font-bold transition-all"
              >
                기본값으로 복원
              </button>

              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-5 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs md:text-sm font-bold transition-all"
                >
                  취소
                </button>
                <button
                  type="button"
                  onClick={handleSaveSubmit}
                  disabled={isSaving}
                  className="flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/30 text-xs md:text-sm transition-all disabled:opacity-50"
                >
                  {isSaving ? <Loader2 size={16} className="animate-spin" /> : <Check size={16} />}
                  <span>{isSaving ? "시트에 저장 중..." : "설정 저장 및 시트 반영"}</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    };

    // --- 대형 모니터 / 키오스크용 명예의 전당 (Hall of Fame) 슬라이드쇼 모달 ---
    const HallOfFameModal = ({
      isOpen,
      onClose,
      monthlyDbData = [],
      activityData = [],
      userInfoData = [],
      orgInfoData = [],
      dashboardConfigs = [],
      selectedYear,
      selectedWeek,
      onRefreshData
    }) => {
      if (!isOpen) return null;

      // 활성화(Y)된 슬라이드만 순서대로 추출
      const activeSlides = useMemo(() => {
        const normalized = normalizeSlideConfigs(dashboardConfigs);
        const filtered = normalized.filter(item => item['활성화여부'] === 'Y').sort((a, b) => Number(a['슬라이드순서']) - Number(b['슬라이드순서']));
        return filtered.length > 0 ? filtered : normalized;
      }, [dashboardConfigs]);

      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [progress, setProgress] = useState(0);
      const [isFullscreen, setIsFullscreen] = useState(false);

      const PROGRESS_INTERVAL = 100; // 100ms마다 업데이트

      // 현재 활성 슬라이드 안전 참조
      const safeIndex = currentSlideIndex < activeSlides.length ? currentSlideIndex : 0;
      const currentSlideItem = activeSlides[safeIndex] || activeSlides[0];
      const currentSlideDurationMs = (currentSlideItem?.['지속시간'] || 10) * 1000;

        const [imgError, setImgError] = useState(false);
        
        const rankColors = {
          1: { border: "border-amber-400 ring-8 ring-amber-400/30 shadow-amber-500/40", bg: "from-amber-500 to-yellow-600", text: "text-amber-300" },
          2: { border: "border-slate-300 ring-8 ring-slate-300/30 shadow-slate-400/40", bg: "from-slate-400 to-slate-600", text: "text-slate-200" },
          3: { border: "border-amber-700 ring-8 ring-amber-700/30 shadow-amber-800/40", bg: "from-amber-700 to-amber-900", text: "text-amber-400" },
          4: { border: "border-blue-400 ring-6 ring-blue-400/30 shadow-blue-500/30", bg: "from-blue-600 to-indigo-700", text: "text-blue-300" },
          5: { border: "border-indigo-400 ring-6 ring-indigo-400/30 shadow-indigo-500/30", bg: "from-indigo-600 to-purple-700", text: "text-indigo-300" },
        };
        const curColor = rankColors[rank] || rankColors[1];
        
        const sizeClasses = size === "xl" 
          ? "w-48 h-48 md:w-60 md:h-60 lg:w-68 lg:h-68 text-6xl md:text-8xl" 
          : size === "md"
          ? "w-28 h-28 md:w-36 md:h-36 lg:w-44 lg:h-44 text-3xl md:text-5xl"
          : "w-36 h-36 md:w-44 md:h-44 lg:w-52 lg:h-52 text-4xl md:text-6xl";

        if (photoUrl && !imgError) {
          return (
            <div className={`relative ${sizeClasses} rounded-full overflow-hidden border-[6px] ${curColor.border} shadow-2xl bg-slate-800 mx-auto transition-transform duration-500 hover:scale-105`}>
              <img 
                src={photoUrl} 
                alt={name} 
                onError={() => setImgError(true)}
                className="w-full h-full object-cover"
              />
            </div>
          );
        }

        return (
          <div className={`relative ${sizeClasses} rounded-full flex items-center justify-center font-black text-white bg-gradient-to-br ${curColor.bg} border-[6px] ${curColor.border} shadow-2xl mx-auto tracking-wider`}>
            {name ? name.slice(-2) : ''}
          </div>
        );
      };

      // ─────────────────────────────────────────────────────────────
      //  [화이트보드 자석 현황판 - 화면 꽉 찬 대형 레이아웃]
      //  * 보험료: 최고값 200만 (10만=1자석=1눈금, 20칸), 주간목표선 100만(10칸)
      //  * 건수: 최고값 20건 (1건=1자석=1눈금, 20칸), 주간목표선 10건(10칸)
      //  * 자석 기둥 바닥 0 눈금선 완전 밀착 & 이름표 0 아래 바깥 1:1 정렬
      // ─────────────────────────────────────────────────────────────
      const MagneticWhiteboard = ({ title, subTitle, type = "premium", data = [] }) => {
        const isPrem = type === "premium";

        // Y축 눈금 및 최대 단위 설정
        // 보험료: 1개 = 10만원 (0 ~ 200만원 = 총 20눈금)
        // 건수: 1개 = 1건 (0 ~ 20건 = 총 20눈금)
        const totalUnits = 20;
        
        // 라벨 표시용 눈금 목록 (위에서부터 아래로)
        const premScaleLabels = [200, 150, 100, 50, 0];
        const contScaleLabels = [20, 15, 10, 5, 0];
        const currentScaleLabels = isPrem ? premScaleLabels : contScaleLabels;

        // 주간 목표 기준선 위치: 보험료 100만원(10칸, 50%), 건수 10건(10칸, 50%)
        const baselineUnit = 10;
        const baselinePercent = Math.round((baselineUnit / totalUnits) * 100);

        const getMagnetBadge = (val, rank) => {
          if (isPrem) {
            const tenThousand = Math.round(val / 10000);
            const badgeBg = rank === 1 ? "bg-gradient-to-br from-amber-300 to-yellow-500 text-slate-950 border-amber-400"
              : rank === 2 ? "bg-gradient-to-br from-red-500 to-rose-600 text-white border-red-300"
              : rank === 3 ? "bg-gradient-to-br from-indigo-500 to-purple-600 text-white border-indigo-300"
              : rank <= 5 ? "bg-gradient-to-br from-teal-500 to-emerald-600 text-white border-teal-300"
              : "bg-slate-700 text-slate-100 border-slate-500";
            return { text: tenThousand > 0 ? `${tenThousand}만` : '0만', bg: badgeBg };
          } else {
            const badgeBg = rank === 1 ? "bg-gradient-to-br from-amber-300 to-yellow-500 text-slate-950 border-amber-400"
              : rank === 2 ? "bg-gradient-to-br from-red-500 to-rose-600 text-white border-red-300"
              : rank === 3 ? "bg-gradient-to-br from-indigo-500 to-purple-600 text-white border-indigo-300"
              : rank <= 5 ? "bg-gradient-to-br from-teal-500 to-emerald-600 text-white border-teal-300"
              : "bg-slate-700 text-slate-100 border-slate-500";
            return { text: `★ ${val}건`, bg: badgeBg };
          }
        };

        return (
          <div className="w-full max-w-[1950px] h-full flex flex-col items-center justify-center animate-in fade-in zoom-in-95 duration-500 px-1 py-1">
            
            {/* 화이트보드 메인 프레임 액자 (화면 가득 차게 확장) */}
            <div className="w-full h-full bg-[#FAFCFF] rounded-3xl border-[14px] border-[#D4AF37] shadow-[0_25px_70px_rgba(0,0,0,0.7)] p-4 md:p-6 lg:p-7 flex flex-col justify-between relative overflow-hidden text-slate-900 select-none">
              
              {/* 상단 화이트보드 헤더 배너 */}
              <div className="flex items-center justify-between border-b-2 border-slate-300 pb-2.5 mb-2.5">
                <div className="flex items-center gap-4">
                  <div className="px-6 py-2 rounded-2xl bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-800 text-white font-black text-xl md:text-2xl tracking-wide shadow-lg flex items-center gap-3">
                    <span>⚡ 최고를 달리는 투게더사업단! 화이팅! ⚡</span>
                  </div>
                  <span className="text-base md:text-xl font-extrabold text-slate-700 bg-slate-100 px-4 py-1.5 rounded-xl border border-slate-300">
                    {title}
                  </span>
                </div>
                
                <div className="flex items-center gap-4">
                  <div className="text-right">
                    <div className="text-xs md:text-sm text-slate-400 font-bold">투게더사업단 주간 실황판</div>
                    <div className="text-lg md:text-xl font-black text-blue-900">{selectedYear}년 {selectedWeek}주차</div>
                  </div>
                  <div className="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-black text-xl shadow-md">
                    T
                  </div>
                </div>
              </div>

              {/* 중앙 모눈종이 자석 그래프 영역 (높이 대폭 확대, 바닥 0 눈금선에 완전 밀착) */}
              <div className="relative w-full flex-1 min-h-[480px] md:min-h-[540px] lg:min-h-[590px] bg-white border-2 border-slate-300 rounded-2xl flex overflow-hidden shadow-inner">
                
                {/* 배경 1눈금 단위 가로선 그리드 (1눈금 = 자석 1개 높이) */}
                <div className="absolute inset-0 flex flex-col-reverse justify-between pointer-events-none z-0">
                  {Array.from({ length: totalUnits }).map((_, uIdx) => (
                    <div 
                      key={uIdx} 
                      className={`w-full border-t ${
                        (uIdx + 1) % 5 === 0 
                          ? "border-blue-900/30 border-dashed" 
                          : "border-slate-200/85 border-solid"
                      }`}
                      style={{ height: `${100 / totalUnits}%` }}
                    />
                  ))}
                </div>

                {/* 좌측 Y축 눈금 라벨 (시작점 0원 / 0건) */}
                <div className="w-20 md:w-24 border-r-2 border-blue-900/40 bg-blue-50/70 flex flex-col justify-between py-2 text-center font-black text-xs md:text-base text-blue-900 z-10 shadow-sm">
                  <div className="text-xs md:text-sm text-blue-700 font-black border-b border-blue-200 pb-1">
                    {isPrem ? '환산(만)' : '체결(건)'}
                  </div>
                  {currentScaleLabels.slice(0, -1).map((sVal, idx) => (
                    <div key={idx} className="leading-none">{sVal.toLocaleString()}</div>
                  ))}
                  <div className="text-xs md:text-sm text-slate-700 font-black">0</div>
                </div>

                {/* 중앙 10개 열 (순수 자석 기둥 영역 - 바닥 0 눈금선에 완전 밀착) */}
                <div className="flex-1 grid grid-cols-10 gap-3 md:gap-4 px-3 md:px-6 items-end relative z-10 h-full">
                  
                  {/* 중간 주간 목표 기준선 (빨간색 점선: 100만원/10칸 or 10건/10칸) */}
                  <div 
                    className="absolute left-0 right-0 border-b-2 border-dashed border-red-500/85 z-0 pointer-events-none"
                    style={{ bottom: `${baselinePercent}%` }}
                  >
                    <span className="absolute right-3 -top-3.5 text-xs font-black text-red-600 bg-red-100 px-3 py-1 rounded-full border border-red-300 shadow-sm">
                      {isPrem ? '주간 목표선 (100만 / 자석 10개)' : '주간 목표선 (10건 / 자석 10개)'}
                    </span>
                  </div>

                  {data.map((user, idx) => {
                    const rankNum = idx + 1;
                    const val = isPrem ? (user.premium || 0) : (user.contracts || 0);
                    
                    // 10만원당 자석 1개 / 1건당 자석 1개 (실적 없으면 0개)
                    const blockCount = isPrem 
                      ? Math.floor(val / 100000) 
                      : Math.floor(val);

                    const clampedBlocks = Math.max(0, Math.min(totalUnits, blockCount));
                    const heightPercent = clampedBlocks > 0 
                      ? Math.min(100, (clampedBlocks / totalUnits) * 100) 
                      : 0;

                    const magnet = getMagnetBadge(val, rankNum);

                    return (
                      <div key={user.sabun || idx} className="flex flex-col items-center h-full justify-end relative z-10 group">
                        
                        {/* 꼭대기 원형 자석 스티커 */}
                        {clampedBlocks > 0 && (
                          <div 
                            className="absolute z-20 transition-all duration-700"
                            style={{ bottom: `calc(${heightPercent}% + 6px)` }}
                          >
                            <div className={`w-11 h-11 md:w-13 md:h-13 lg:w-14 lg:h-14 rounded-full border-2 ${magnet.bg} shadow-xl flex flex-col items-center justify-center text-center leading-none transform -rotate-3 hover:scale-125 transition-transform`}>
                              <span className="text-[10px] md:text-xs font-black opacity-90">{rankNum}위</span>
                              <span className="text-xs md:text-sm lg:text-base font-black tracking-tight mt-0.5">{magnet.text}</span>
                            </div>
                          </div>
                        )}

                        {/* 빨간색 자석 블록 누적 기둥 (1눈금 = 1블록, 0 눈금선에 바로 밀착) */}
                        <div 
                          className="w-7 md:w-10 lg:w-12 flex flex-col-reverse justify-start items-center transition-all duration-700"
                          style={{ height: `${heightPercent}%` }}
                        >
                          {Array.from({ length: clampedBlocks }).map((_, bIdx) => (
                            <div 
                              key={bIdx}
                              className="w-full rounded-[2px] bg-gradient-to-r from-red-600 via-rose-500 to-red-700 border-t border-red-300 shadow-[0_1px_3px_rgba(0,0,0,0.35)]"
                              style={{ height: `${100 / clampedBlocks}%` }}
                            />
                          ))}
                        </div>

                      </div>
                    );
                  })}
                </div>

                {/* 우측 Y축 눈금 라벨 */}
                <div className="w-20 md:w-24 border-l-2 border-blue-900/40 bg-blue-50/70 flex flex-col justify-between py-2 text-center font-black text-xs md:text-base text-blue-900 z-10 shadow-sm">
                  <div className="text-xs md:text-sm text-blue-700 font-black border-b border-blue-200 pb-1">
                    {isPrem ? '환산(만)' : '체결(건)'}
                  </div>
                  {currentScaleLabels.slice(0, -1).map((sVal, idx) => (
                    <div key={idx} className="leading-none">{sVal.toLocaleString()}</div>
                  ))}
                  <div className="text-xs md:text-sm text-slate-700 font-black">0</div>
                </div>

              </div>

              {/* ★ 눈금선 아래(0 아래 바깥)에 배치된 플래너 이름표 / 명찰 영역 */}
              <div className="w-full flex items-center mt-2.5">
                {/* 좌측 Y축 폭 맞춤용 빈 공간 */}
                <div className="w-20 md:w-24 shrink-0 text-center font-black text-xs md:text-sm text-slate-400">
                  순위/이름
                </div>

                {/* 중앙 10개 열 이름표 */}
                <div className="flex-1 grid grid-cols-10 gap-3 md:gap-4 px-3 md:px-6">
                  {data.map((user, idx) => {
                    const rankNum = idx + 1;
                    const val = isPrem ? (user.premium || 0) : (user.contracts || 0);

                    return (
                      <div key={user.sabun || idx} className="w-full">
                        <div className={`p-2 md:p-2.5 rounded-xl text-center border shadow-md transition-all hover:scale-105 ${
                          rankNum === 1 
                            ? "bg-amber-200 border-amber-400 text-slate-950 font-black ring-4 ring-amber-400/50" 
                            : rankNum <= 3
                            ? "bg-amber-100 border-amber-300 text-slate-900 font-bold"
                            : "bg-slate-100 border-slate-300 text-slate-800 font-medium"
                        }`}>
                          <div className="text-[11px] md:text-xs text-blue-900 font-black truncate">
                            {user.dept?.replace('투게더사업단', '').trim() || '투게더'}
                          </div>
                          <div className="text-sm md:text-base font-black truncate mt-0.5">
                            {rankNum}위 {user.name}
                          </div>
                          <div className="text-[11px] md:text-xs text-slate-500 font-bold truncate mt-0.5">
                            {isPrem ? `${formatCurrency(user.premium)}원` : `${user.contracts}건`}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* 우측 Y축 폭 맞춤용 빈 공간 */}
                <div className="w-20 md:w-24 shrink-0"></div>
              </div>

              {/* 하단 마그넷 안내 푸터 바 */}
              <div className="mt-2.5 flex items-center justify-between text-xs md:text-base font-bold text-slate-600 bg-slate-100/90 p-3 rounded-2xl border border-slate-300">
                <div className="flex items-center gap-6">
                  <span className="flex items-center gap-2">
                    <span className="w-4 h-4 rounded-sm bg-red-600 inline-block shadow"></span> 
                    {isPrem ? "자석 1블록 = 10만원 (1눈금 / 최고 200만)" : "자석 1블록 = 1건 체결 (1눈금 / 최고 20건)"}
                  </span>
                  <span className="flex items-center gap-2">
                    <span className="w-4 h-4 rounded-full bg-amber-400 inline-block shadow"></span> 1위 챔피언 마그넷
                  </span>
                </div>
                <div className="text-blue-900 font-black">
                  ※ 매주 실시간 데이터 기반으로 자동 업데이트되는 투게더사업단 주간 현황판입니다.
                </div>
              </div>

            </div>

          </div>
        );
      };

      return (
        <div className="fixed inset-0 z-50 bg-[#070A11] text-white flex flex-col justify-between overflow-hidden select-none font-sans">
          
          {/* 10초 상단 네온 프로그레스 바 */}
          <div className="w-full bg-slate-800/60 h-2 overflow-hidden fixed top-0 left-0 z-50">
            <div 
              className="h-full bg-gradient-to-r from-amber-400 via-yellow-400 to-orange-500 transition-all ease-linear shadow-[0_0_16px_rgba(251,191,36,0.9)]"
              style={{ width: `${progress}%`, transitionDuration: `${PROGRESS_INTERVAL}ms` }}
            />
          </div>

          {/* 상단 컨트롤 헤더 */}
          <div className="flex items-center justify-between px-8 md:px-14 py-5 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/70 z-40">
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-yellow-600 flex items-center justify-center shadow-lg shadow-amber-500/30">
                <Crown size={28} className="text-slate-950" />
              </div>
              <div>
                <h1 className="text-2xl md:text-3xl font-black tracking-tight bg-gradient-to-r from-amber-200 via-yellow-300 to-amber-400 bg-clip-text text-transparent">
                  투게더사업단 명예의 전당
                </h1>
                <p className="text-sm text-slate-400 font-medium">
                  {selectedYear}년 {monthTitle} 마감 기준 실시간 챔피언 전광판
                </p>
              </div>
            </div>

            {/* 우측 컨트롤 버튼들 */}
            <div className="flex items-center gap-4">
              <button 
                onClick={() => setIsPlaying(p => !p)} 
                className="flex items-center gap-2 px-4 py-2 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 text-sm font-semibold transition-all"
                title={isPlaying ? "일시정지 (Space)" : "재생 (Space)"}
              >
                {isPlaying ? <Pause size={16} className="text-amber-400" /> : <Play size={16} className="text-emerald-400" />}
                {isPlaying ? "일시정지" : "자동재생"}
              </button>

              <button 
                onClick={toggleFullscreen} 
                className="p-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 transition-all"
                title="전체화면 (F)"
              >
                {isFullscreen ? <Minimize2 size={18} /> : <Maximize2 size={18} />}
              </button>

              <button 
                onClick={onClose} 
                className="p-2.5 bg-red-500/20 hover:bg-red-500/40 text-red-300 hover:text-red-100 rounded-xl border border-red-500/30 transition-all"
                title="닫기 (ESC)"
              >
                <XIcon size={20} />
              </button>
            </div>
          </div>

          {/* 중앙 슬라이드 콘텐츠 뷰 */}
          <div className="relative flex-1 flex items-center justify-center p-4 md:p-6 lg:p-8 overflow-hidden">
            
            {/* 좌/우 빠른 전환 화살표 */}
            <button 
              onClick={handlePrev}
              className="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-slate-900/70 hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center backdrop-blur-md border border-slate-700/80 transition-all z-30 shadow-2xl hover:scale-110"
            >
              <ChevronLeft size={34} />
            </button>

            <button 
              onClick={handleNext}
              className="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-slate-900/70 hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center backdrop-blur-md border border-slate-700/80 transition-all z-30 shadow-2xl hover:scale-110"
            >
              <ChevronRight size={34} />
            </button>

            {/* 배경 은은한 대형 글로우 라이트 효과 */}
            <div className="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[120px] pointer-events-none" />
            <div className="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-blue-500/10 rounded-full blur-[120px] pointer-events-none" />

            {/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
                SLIDE 0: 지난달 실적 챔피언 (타이틀 유지 & 본문 황금비율 위치)
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */}
            {currentSlideItem?.id === 'last_month_champion' && (
              <div className="w-full max-w-[1750px] h-full flex flex-col justify-start items-center pt-2 pb-4 px-4 animate-in fade-in zoom-in-95 duration-500">
                {/* 상단 타이틀 */}
                <div className="text-center mt-1 mb-10 md:mb-12">
                  <div className="inline-flex items-center gap-2.5 px-6 py-2 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-300 text-base md:text-lg font-black mb-3 shadow-lg shadow-amber-500/10">
                    <Crown size={20} /> LAST MONTH CHAMPIONS
                  </div>
                  <h2 className="text-4xl md:text-6xl lg:text-7xl font-black tracking-tight text-white drop-shadow-md">
                    {prevMonthTitle} 영광의 챔피언
                  </h2>
                  <p className="text-slate-300 text-base md:text-2xl mt-3 font-medium">
                    지난달 최고의 성과와 눈부신 열정으로 투게더사업단을 빛낸 영예의 1위 주인공들입니다.
                  </p>

          {/* 하단 슬라이드 탭 네비게이션 & 단축키 안내 (세로 스크롤바 원천 차단) */}

            <div className="text-xs md:text-sm text-slate-500 font-semibold flex items-center gap-5 shrink-0">
              <span>Space: 일시정지</span>
              <span>← →: 이동</span>

              <span>ESC: 닫기</span>

    };

    // --- 메인 App 컴포넌트 ---
    function App() {
      // ─────────────────────────────────────────────────────
      //  GAS 백엔드 URL
      //  GAS Web App 배포 후 아래 값을 실제 URL로 교체하세요.
      //  배포 설정: 다음 사용자로 실행 = 나 / 액세스 = 모든 사용자
      // ─────────────────────────────────────────────────────
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbxyUPRohQ_zBgY-NYT6A3MtwY7f14XWzyb93N9B5p_LA8x1O4qGjkMv1Qi6DVfDRw95/exec';
      const GAS_CONFIGURED = !GAS_URL.includes('YOUR_SCRIPT_ID');

      const currentTimeInfo = getCurrentWeekAndYear();
      
      const [data, setData] = useState([]);
      const [userInfoData, setUserInfoData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [usingMockData, setUsingMockData] = useState(false);

      // 월실적_DB 데이터 상태
      const [monthlyDbData, setMonthlyDbData] = useState([]);
      const [monthlyDbLoading, setMonthlyDbLoading] = useState(false);
      const [monthlyDbError, setMonthlyDbError] = useState(null);

      // 조직정보(단체사진, 슬로건 등) 데이터 상태
      const [orgInfoData, setOrgInfoData] = useState([]);

      // [신규] 대시보드 관리(슬라이드 순서/노출/시간) 상태
      const [dashboardConfigs, setDashboardConfigs] = useState([]);
      const [showDashboardConfigModal, setShowDashboardConfigModal] = useState(false);
      const [isSavingConfig, setIsSavingConfig] = useState(false);

      // 명예의 전당 (슬라이드쇼 전광판) 모달 상태
      const [showHallOfFame, setShowHallOfFame] = useState(false);

      // GAS 미설정 안내
      const [gasNotConfigured, setGasNotConfigured] = useState(!GAS_CONFIGURED);

      // 필터 및 화면 설정 상태
      const [selectedTab, setSelectedTab] = useState('결과'); 
      const [selectedYear, setSelectedYear] = useState(String(currentTimeInfo.year));
      const [selectedWeek, setSelectedWeek] = useState(String(currentTimeInfo.week));
      const [selectedDept, setSelectedDept] = useState('전체');
      const [sortBy, setSortBy] = useState('사번순'); 

      // 커스텀 토스트 알림 상태
      const [toast, setToast] = useState(null);

      // 진단 리포트용 기간 상태 (기본값을 '직전 4주'인 4로 변경)
      const [diagnosticPeriod, setDiagnosticPeriod] = useState(4);

      // 팝업(모달) 상태 관리
      const [modalUser, setModalUser] = useState(null);
      // [조정 사항] 개별 통계 모달 기본 기간을 '직전 4주'로 설정
      const [modalPeriod, setModalPeriod] = useState(4);

      // AI 격려 메시지 및 스마트 브리핑 생성용 상태
      const [coachingModal, setCoachingModal] = useState(null); 
      const [customContext, setCustomContext] = useState(""); 
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiBriefing, setAiBriefing] = useState("");
      const [isBriefingGenerating, setIsBriefingGenerating] = useState(false);
      const [apiError, setApiError] = useState("");
      const [copied, setCopied] = useState(false);

      // 모달 활성화 핸들러 함수
      const handleOpenModal = (sabun, name) => {
        setModalUser({ sabun, name });
      };

      const showToast = (message, type = "info") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // 오늘 날짜 및 주차별 라벨 계산
      const today = new Date();
      const formattedToday = today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

      const getWeekLabel = (weekNumStr, yearNumStr) => {
        const week = parseInt(weekNumStr, 10);
        const year = parseInt(yearNumStr, 10);

        if (year === currentTimeInfo.year) {
          if (week === currentTimeInfo.week) return `${week}주차 (이번주)`;
          if (week === currentTimeInfo.week - 1) return `${week}주차 (지난주)`;
          if (week === currentTimeInfo.week + 1) return `${week}주차 (다음주)`;
        }

        const jan1 = new Date(year, 0, 1);
        let day = jan1.getDay();
        let diffToMonday = day === 0 ? -6 : 1 - day;
        const firstWeekStart = new Date(year, 0, 1 + diffToMonday);
        firstWeekStart.setHours(0, 0, 0, 0);

        const targetDate = new Date(firstWeekStart);
        targetDate.setDate(targetDate.getDate() + (week - 1) * 7);

        const month = targetDate.getMonth() + 1;
        const date = targetDate.getDate();

        return `${week}주차 (${month}/${date})`;
      };

      // ─────────────────────────────────────────────────────
      //  GAS API 공통 호출 헬퍼
      //  GAS Web App은 302 리다이렉트를 거치므로 redirect:'follow'
      // ─────────────────────────────────────────────────────
      const fetchFromGas = async (type) => {
        const url = `${GAS_URL}?type=${type}`;
        const res = await fetch(url, { redirect: 'follow' });
        if (!res.ok) throw new Error(`GAS 응답 오류 (${res.status})`);
        const json = await res.json();
        if (json.status === 'error') throw new Error(json.message);
        return json.data; // 배열 반환
      };

      // GAS에서 받은 row 객체의 값을 문자열로 정규화
      // (숫자·날짜 등 JSON 타입 → 기존 코드와 호환되는 문자열)
      const normalizeGasRow = (row) => {
        const out = {};
        Object.keys(row).forEach(k => {
          const v = row[k];
          if (v === null || v === undefined) out[k] = '';
          else if (typeof v === 'number') out[k] = String(v);
          else out[k] = String(v);
        });
        return out;
      };

      // ─────────────────────────────────────────────────────
      //  대시보드관리 시트 로드 (GAS ?type=dashboardconfig)
      // ─────────────────────────────────────────────────────
      const fetchDashboardConfig = async () => {
        if (!GAS_CONFIGURED) return;
        try {
          const rawConfigs = await fetchFromGas('dashboardconfig');
          if (rawConfigs && rawConfigs.length > 0) {
            setDashboardConfigs(rawConfigs);
          }
        } catch (err) {
          console.warn('대시보드 관리 설정 조회 오류 (기본값 사용):', err.message);
        }
      };

      // ─────────────────────────────────────────────────────
      //  대시보드관리 시트 저장
      // ─────────────────────────────────────────────────────
      const saveDashboardConfigToGas = async (updatedConfigs) => {
        setIsSavingConfig(true);
        try {
          if (!GAS_CONFIGURED) {
            setDashboardConfigs(updatedConfigs);
            showToast('로컬에 설정이 적용되었습니다.', 'info');
            setShowDashboardConfigModal(false);
            return;
          }

          // 1. POST 방식 시도
          try {
            const res = await fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'save_dashboardconfig', data: updatedConfigs }),
              redirect: 'follow'
            });
            if (res.ok) {
              const json = await res.json();
              if (json.status === 'success') {
                setDashboardConfigs(updatedConfigs);
                showToast('대시보드 설정이 시트에 성공적으로 저장되었습니다!', 'success');
                setShowDashboardConfigModal(false);
                return;
              }
            }
          } catch (postErr) {
            console.warn('POST 저장 실패, GET fallback 시도:', postErr);
          }

          // 2. GET fallback 방식 시도 (CORS 등 이슈 대비)
          const fallbackUrl = `${GAS_URL}?type=save_dashboardconfig&data=${encodeURIComponent(JSON.stringify(updatedConfigs))}`;
          const res = await fetch(fallbackUrl, { redirect: 'follow' });
          if (!res.ok) throw new Error(`시트 저장 응답 오류 (${res.status})`);
          const json = await res.json();
          if (json.status === 'error') throw new Error(json.message);

          setDashboardConfigs(updatedConfigs);
          showToast('대시보드 설정이 시트에 성공적으로 저장되었습니다!', 'success');
          setShowDashboardConfigModal(false);
        } catch (err) {
          console.error('대시보드 설정 저장 실패:', err);
          setDashboardConfigs(updatedConfigs);
          showToast('시트 저장 중 오류가 발생했으나 화면에는 즉시 적용되었습니다: ' + err.message, 'warning');
          setShowDashboardConfigModal(false);
        } finally {
          setIsSavingConfig(false);
        }
      };

      // ─────────────────────────────────────────────────────
      //  월실적_DB 로드 (GAS ?type=monthlydb)
      // ─────────────────────────────────────────────────────
      const fetchMonthlyDb = async () => {
        if (!GAS_CONFIGURED) {
          setMonthlyDbError('GAS URL이 설정되지 않았습니다.');
          return;
        }
        setMonthlyDbLoading(true);
        setMonthlyDbError(null);
        try {
          const rawRows = await fetchFromGas('monthlydb');
          // GAS는 숫자/날짜 타입으로 반환 → 각 필드를 문자열로 정규화
          const rows = rawRows.map(normalizeGasRow);
          setMonthlyDbData(rows);
          showToast('월실적_DB 연동에 성공했습니다.', 'success');
        } catch (err) {
          console.warn('월실적_DB 연동 오류:', err.message);
          setMonthlyDbError(err.message);
          showToast('월실적_DB 연동 실패: ' + err.message, 'error');
        } finally {
          setMonthlyDbLoading(false);
        }
      };

      // ─────────────────────────────────────────────────────
      //  조직정보 로드 (GAS ?type=orginfo)
      // ─────────────────────────────────────────────────────
      const fetchOrgInfo = async () => {
        if (!GAS_CONFIGURED) return;
        try {
          const rawOrg = await fetchFromGas('orginfo');
          if (rawOrg && rawOrg.length > 0) {
            const rows = rawOrg.map(normalizeGasRow);
            setOrgInfoData(rows);
          }
        } catch (err) {
          console.log('조직정보 로드 스킵 또는 미설정:', err.message);
        }
      };

      // ─────────────────────────────────────────────────────
      //  활동_DB 로드 (GAS ?type=activity)
      // ─────────────────────────────────────────────────────
      const fetchData = async () => {
        setLoading(true);
        setError(null);
        setUsingMockData(false);
        setAiBriefing('');

        if (!GAS_CONFIGURED) {
          setGasNotConfigured(true);
          loadMockData();
          setLoading(false);
          return;
        }

        try {
          const [rawActivity, rawUserInfo] = await Promise.all([
            fetchFromGas('activity'),
            fetchFromGas('userinfo')
          ]);

          if (!rawActivity || rawActivity.length === 0)
            throw new Error('활동 데이터가 비어있습니다.');
          if (!rawUserInfo || rawUserInfo.length === 0)
            throw new Error('사용자 정보 데이터가 비어있습니다.');

          const activityRows = rawActivity.map(normalizeGasRow);
          const userInfoRows = rawUserInfo.map(normalizeGasRow);

          setData(activityRows);
          setUserInfoData(userInfoRows);
          showToast('구글 시트 연동에 성공했습니다.', 'success');
        } catch (err) {
          console.warn('데이터 연동 중 오류 발생:', err.message);
          setError(err.message);
          loadMockData();
        } finally {
          setLoading(false);
        }
      };

      const loadMockData = () => {
        setUsingMockData(true);
        const mock = [
          { 소속: '투게더사업단', 사번: '2023001', 이름: '김대표', 연도: String(currentTimeInfo.year), 주차: String(currentTimeInfo.week), 예정결과: '예정', TA: '10', AP: '5', P: '3', C: '1', N: '1', 소개: '2', 활동계: '22', 보험료: '1,500,000', 저장일시: '', 마감일시: '' },

      const availableYears = useMemo(() => {

      const availableDepts = useMemo(() => {
        const deptsFromActivity = data.map(item => item['소속']);

      // --- 퀵 액션 버튼 핸들러 ---
      const handleQuickAction = (tab, weekOffset) => {
        const targetYear = String(currentTimeInfo.year);

        setSelectedYear(targetYear);

        showToast(`${getWeekLabel(targetWeek, targetYear)} ${tab} 정보를 조회합니다.`);
      };

      // 월간 실적 계산: 월실적_DB의 '실적분석_신계약전체' 시트 기반
      const monthlyPerformanceStats = useMemo(() => {
        if (selectedTab !== '월간 실적') return null;

        const parseNum = (val) => {
          if (val === null || val === undefined || val === '') return 0;
          return Number(String(val).replace(/[^0-9.-]+/g, '')) || 0;
        };

        // 마감월 기준 앵커월 계산 (YYYY-MM 형식)
        const anchorMonth = getWeekYearMonth(selectedYear, selectedWeek);
        const monthsList = getThreeMonthsList(anchorMonth);

        // 사용자정보에서 대상 사번 매핑 (활동관리 'Y' 및 'Month' 모두 포함)
        const sabunToInfo = {}; // sabun -> { 이름, 소속, 활동관리, user }
        userInfoData.forEach(row => {
          const sabun = String(row['사번'] || '').trim();
          if (!sabun) return;
          const manage = String(row['활동관리'] || '').trim().toUpperCase();
          if (manage !== 'Y' && manage !== 'MONTH') return;

          sabunToInfo[sabun] = {
            이름: row['이름'] || '',
            소속: row['소속'] || '',
            활동관리: manage,
            user: row
          };
        });

        // 마감월 컬럼명 자동 탐지 (첫 번째 행에서 '마감월' 포함 컬럼 찾기)
        const detectColName = (rows, candidates) => {
          if (rows.length === 0) return null;
          const keys = Object.keys(rows[0]);
          for (const cand of candidates) {
            const found = keys.find(k => k.trim() === cand || k.includes(cand));
            if (found) return found;
          }
          return null;
        };

        const colMarGamwol  = detectColName(monthlyDbData, ['마감월']);
        const colMojibJabun = detectColName(monthlyDbData, ['모집자사번']);
        const colBohumryo   = detectColName(monthlyDbData, ['보험료']);
        const colGyeyakState = detectColName(monthlyDbData, ['계약상태']);

        // 컬럼이 없으면 빈 결과 반환
        if (!colMarGamwol || !colMojibJabun || !colBohumryo) {
          const emptyTotals = { premium: 0, contracts: 0, ta: 0, ap: 0, activePartners: new Set() };
          return {
            trendLabels: monthsList.map(m => formatMonthLabel(m)),
            premiumTrend: [0, 0, 0],
            contractTrend: [0, 0, 0],
            anchorMonth,
            currentMonthTotals: emptyTotals,
            currentMonthActiveCount: 0,
            anchorPartnersList: [],
            monthlyDbNotReady: true,
          };
        }

        // 집계 초기화
        const monthlyTotals = {};
        monthsList.forEach(m => {
          monthlyTotals[m] = { premium: 0, contracts: 0, ta: 0, ap: 0, activePartners: new Set() };
        });
        const partnerMonthlyAgg = {};
        monthsList.forEach(m => { partnerMonthlyAgg[m] = {}; });

        // 월실적_DB 필터링 및 집계
        monthlyDbData.forEach(row => {
          const rawMonth = row[colMarGamwol];
          const rowMonth = normalizeMonth(rawMonth);
          if (!monthsList.includes(rowMonth)) return;

          const sabun = String(row[colMojibJabun] || '').trim();
          if (!sabun) return;

          const userInfo = sabunToInfo[sabun];
          if (!userInfo) return; // 사용자정보에 등록되지 않은(또는 활동미대상) 사번 제외

          // 소속 필터
          if (selectedDept !== '전체' && userInfo.소속 !== selectedDept) return;

          // 퇴사자 필터: 해당 실적 발생월(rowMonth) 당시 재직 중이었는지 확인
          if (!isUserActiveInMonth(userInfo.user, rowMonth)) return;

          // 계약상태 필터 - '정상'인 행만
          if (colGyeyakState) {
            const state = String(row[colGyeyakState] || '').trim();
            if (state !== '정상') return;
          }

          const premium = parseNum(row[colBohumryo]);

          monthlyTotals[rowMonth].premium += premium;
          monthlyTotals[rowMonth].contracts += 1; // 정상 계약 건수
          monthlyTotals[rowMonth].activePartners.add(sabun);

          if (!partnerMonthlyAgg[rowMonth][sabun]) {
            partnerMonthlyAgg[rowMonth][sabun] = {
              사번: sabun,
              이름: userInfo.이름,
              소속: userInfo.소속,
              건수: 0,
              보험료: 0,
            };
          }
          partnerMonthlyAgg[rowMonth][sabun].건수 += 1;
          partnerMonthlyAgg[rowMonth][sabun].보험료 += premium;
        });

        const trendLabels = monthsList.map(m => formatMonthLabel(m));
        const premiumTrend = monthsList.map(m => monthlyTotals[m].premium);
        const contractTrend = monthsList.map(m => monthlyTotals[m].contracts);

        const currentMonthTotals = monthlyTotals[anchorMonth] || { premium: 0, contracts: 0, ta: 0, ap: 0, activePartners: new Set() };
        const currentMonthActiveCount = currentMonthTotals.activePartners.size;
        const anchorPartnersList = Object.values(partnerMonthlyAgg[anchorMonth] || {}).sort((a, b) => b.보험료 - a.보험료);

        // 3개월 누적 합계
        const cumulativePremium = premiumTrend.reduce((acc, v) => acc + v, 0);
        const cumulativeContracts = contractTrend.reduce((acc, v) => acc + v, 0);

        return {
          trendLabels,
          premiumTrend,
          contractTrend,
          anchorMonth,
          currentMonthTotals,
          currentMonthActiveCount,
          anchorPartnersList,
          cumulativePremium,
          cumulativeContracts,
          monthlyDbNotReady: false,
        };
      }, [monthlyDbData, selectedTab, selectedYear, selectedWeek, selectedDept, userInfoData]);

      const filteredData = useMemo(() => {
        const effectiveTab = (selectedTab === '진단 리포트' ? '결과' : selectedTab);
        const targetMonth = getWeekYearMonth(selectedYear, selectedWeek);

        // 1. 소속 필터 + 활동관리 'Y' (Month 제외) + 해당 주차(월) 기준 재직자 선별
        const targetUsers = userInfoData.filter(user => {
          const matchDept = (selectedDept === '전체' || user['소속'] === selectedDept);
          const matchManage = (String(user['활동관리'] || '').trim().toUpperCase() === 'Y');
          const matchActive = isUserActiveInMonth(user, targetMonth);
          return matchDept && matchManage && matchActive;
        });

        // 2. 현재 연도, 주차, 예정결과에 해당하는 활동 기록을 사번 단위로 매핑 (Map 이용 O(N) 최적화)
        const activityMap = new Map();
        data.forEach(item => {
          const matchTab = item['예정결과'] === effectiveTab;
          const matchYear = item['연도'] === String(selectedYear);
          const matchWeek = item['주차'] === String(selectedWeek);
          if (matchTab && matchYear && matchWeek) {
            const sabun = String(item['사번'] || '').trim();
            if (sabun) {
              activityMap.set(sabun, item);
            }
          }
        });

        // 3. 대상자 목록 기준으로 매칭하여 반환
        return targetUsers.map(user => {
          const sabun = String(user['사번'] || '').trim();
          const act = activityMap.get(sabun);
          if (act) {
            return {
              ...act,
              이름: user['이름'] || act['이름'],
              소속: user['소속'] || act['소속'],
              마감일시: act['마감일시'] || act['저장일시'] || ''
            };
          } else {
            // 미입력자 객체 생성
            return {
              소속: user['소속'] || '미지정',
              사번: sabun,
              이름: user['이름'] || '',
              연도: String(selectedYear),
              주차: String(selectedWeek),
              예정결과: effectiveTab,
              TA: '',
              AP: '',
              P: '',
              C: '',
              N: '',
              소개: '',
              활동계: '',
              보험료: '',
              저장일시: '',
              마감일시: '',
              isUnsubmitted: true
            };
          }
        });
      }, [data, userInfoData, selectedTab, selectedYear, selectedWeek, selectedDept]);

      // --- 성과 우수자 및 필터/사번 정렬 로직 고도화 ---
      const processedData = useMemo(() => {
        if (selectedTab === '진단 리포트' || selectedTab === '월간 실적' || filteredData.length === 0) return [];

        const parseNum = (val) => Number(String(val).replace(/[^0-9.-]+/g, "")) || 0;

        let topPremiumRow = null;
        let topNRow = null;

        // 1. 보험료 1등 계산
        filteredData.forEach(row => {
          if (!topPremiumRow) {
            topPremiumRow = row;
            return;
          }
          const curP = parseNum(row['보험료']);
          const curN = parseNum(row['N']);
          const curA = parseNum(row['활동계']);
          
          const maxP = parseNum(topPremiumRow['보험료']);
          const maxN = parseNum(topPremiumRow['N']);
          const maxA = parseNum(topPremiumRow['활동계']);

          if (curP > maxP) {
            topPremiumRow = row;
          } else if (curP === maxP) {
            if (curN > maxN) {
              topPremiumRow = row;
            } else if (curN === maxN) {
              if (curA > maxA) {
                topPremiumRow = row;
              }
            }
          }
        });

        // 2. 나머지 중 건수(N) 1등 계산
        const remainingForN = topPremiumRow 
          ? filteredData.filter(row => row !== topPremiumRow) 
          : [...filteredData];

        remainingForN.forEach(row => {
          if (!topNRow) {
            topNRow = row;
            return;
          }
          const curN = parseNum(row['N']);
          const curP = parseNum(row['보험료']);
          const curA = parseNum(row['활동계']);

          const maxN = parseNum(topNRow['N']);
          const maxP = parseNum(topNRow['보험료']);
          const maxA = parseNum(topNRow['활동계']);

          if (curN > maxN) {
            topNRow = row;
          } else if (curN === maxN) {
            if (curP > maxP) {
              topNRow = row;
            } else if (curP === maxP) {
              if (curA > maxA) {
                topNRow = row;
              }
            }
          }
        });

        if (sortBy === '실적순') {
          const rest = remainingForN.filter(row => row !== topNRow);
          rest.sort((a, b) => {
            const pA = parseNum(a['보험료']), pB = parseNum(b['보험료']);
            if (pA !== pB) return pB - pA;
            
            const nA = parseNum(a['N']), nB = parseNum(b['N']);
            if (nA !== nB) return nB - nA;
            
            const aA = parseNum(a['활동계']), aB = parseNum(b['활동계']);
            if (aA !== aB) return aB - aA;

            const sabunA = String(a['사번'] || '');
            const sabunB = String(b['사번'] || '');
            return sabunA.localeCompare(sabunB, undefined, { numeric: true });
          });

          const result = [];
          if (topPremiumRow) result.push({ ...topPremiumRow, badgePremium: true, badgeN: false });
          if (topNRow) result.push({ ...topNRow, badgePremium: false, badgeN: true });
          
          const restWithBadges = rest.map(row => ({ ...row, badgePremium: false, badgeN: false }));
          return [...result, ...restWithBadges];
        } else {
          // 사번순일 때는 모든 줄을 사번으로 정렬하며 배지와 하이라이트는 뷰에서 제거
          const allRowsWithBadges = filteredData.map(row => {
            const isPremium = topPremiumRow && row['사번'] === topPremiumRow['사번'] && row['연도'] === topPremiumRow['연도'] && row['주차'] === topPremiumRow['주차'];
            const isN = topNRow && row['사번'] === topNRow['사번'] && row['연도'] === topNRow['연도'] && row['주차'] === topNRow['주차'];
            return {
              ...row,
              badgePremium: !!isPremium,
              badgeN: !!isN
            };
          });

          allRowsWithBadges.sort((a, b) => {
            const sabunA = String(a['사번'] || '');
            const sabunB = String(b['사번'] || '');
            return sabunA.localeCompare(sabunB, undefined, { numeric: true });
          });

          return allRowsWithBadges;
        }
      }, [filteredData, selectedTab, sortBy]);

      // 팝업창 전용 동적 기간(직전 N주) 통계 계산 로직
      const modalStats = useMemo(() => {
        if (!modalUser) return null;
        
        const sabun = modalUser.sabun;
        const parseNum = (val) => Number(String(val).replace(/[^0-9.-]+/g, "")) || 0;

        const pastResultData = data.filter(d => {
          if (d['예정결과'] !== '결과') return false;
          const y = parseInt(d['연도'], 10);
          const w = parseInt(d['주차'], 10);
          return (y < currentTimeInfo.year) || (y === currentTimeInfo.year && w < currentTimeInfo.week);
        });

        const distinctWeeks = [...new Set(pastResultData.map(d => `${d['연도']}-${String(d['주차']).padStart(2, '0')}`))].sort();
        
        const currentTarget = `${selectedYear}-${String(selectedWeek).padStart(2, '0')}`;
        let targetIdx = distinctWeeks.indexOf(currentTarget);
        
        if (targetIdx === -1) {
          targetIdx = distinctWeeks.filter(w => w <= currentTarget).length - 1;
        }

        const targetWeeks = targetIdx >= 0 
          ? distinctWeeks.slice(Math.max(0, targetIdx - modalPeriod + 1), targetIdx + 1)
          : [];

        const expected = { TA: 0, AP: 0, P: 0, C: 0, N: 0, 소개: 0, 활동계: 0, 보험료: 0 };
        const actual = { TA: 0, AP: 0, P: 0, C: 0, N: 0, 소개: 0, 활동계: 0, 보험료: 0 };
        const activeWeeks = new Set();
        const weeksWithN = new Set();

        data.forEach(row => {
          if (row['사번'] !== sabun) return;
          const weekStr = `${row['연도']}-${String(row['주차']).padStart(2, '0')}`;
          
          if (!targetWeeks.includes(weekStr)) return;

          const isExpected = row['예정결과'] === '예정';
          const isActual = row['예정결과'] === '결과';

            }
          });

          if (isActual) activeWeeks.add(weekStr);
        });

        return { expected, actual, activeWeeks, weeksWithN };
      }, [data, modalUser, modalPeriod, selectedYear, selectedWeek, currentTimeInfo]);

      const diagnosticData = useMemo(() => {
        if (selectedTab !== '진단 리포트') return null;

        const parseNum = (val) => Number(String(val).replace(/[^0-9.-]+/g, "")) || 0;

        const validUsers = userInfoData.filter(user => {

        const validSabunMap = new Map(validUsers.map(u => [String(u['사번'] || '').trim(), u]));
